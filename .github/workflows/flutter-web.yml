# Flutter web (client panel) → Firebase Hosting: superwizor-app.
#
# Mirrors marketing-site.yml's production deploy so the Flutter web bundle
# ships the same way the marketing site does — CI-authenticated via Workload
# Identity Federation, no local `firebase login` ever again. This is the one
# hosting target that used to be deployed by hand from a developer's Mac
# (docs/39 live-ops); a lapsed local gcloud ADC credential is exactly what
# broke that manual step, so we move it into CI on the shared service account.
#
# The generated Dart proto stubs and l10n are committed under
# flutter-app/superwizor/lib, so the build needs no code-gen here — just
# `flutter build web`.
name: Flutter Web (superwizor-app)

on:
  push:
    branches: [main]
    paths:
      - "flutter-app/superwizor/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/flutter-web.yml"
  workflow_dispatch: {} # manual re-deploy from the Actions tab

# WIF needs an OIDC token; least privilege otherwise.
permissions:
  contents: read
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: flutter-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy hosting:superwizor-app
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-app
      url: https://superwizor-app.web.app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin to the toolchain used locally (pubspec sdk ^3.10.4).
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: flutter-app/superwizor
        run: flutter pub get

      - name: Build web (release)
        working-directory: flutter-app/superwizor
        # gen-l10n runs automatically via l10n.yaml during the build.
        run: flutter build web --release

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy hosting:superwizor-app
        # firebase-tools picks up the WIF credentials the auth step wrote to
        # GOOGLE_APPLICATION_CREDENTIALS — same mechanism as the marketing
        # site. hosting:superwizor-app maps to the site via .firebaserc.
        run: firebase deploy --only hosting:superwizor-app --project superwizor-ai-25ecd
