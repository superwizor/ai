name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-central2
  REPOSITORY: services
  IMAGE_NAME: superwizor-api
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./superwizor-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'superwizor-backend/go.work'
          cache-dependency-path: 'superwizor-backend/**/go.sum'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: |
          go install github.com/bufbuild/buf/cmd/buf@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.5

      - name: Lint Protobuf
        run: buf lint proto/

      - name: Generate Protobuf
        run: buf generate proto/

      - name: Lint Go
        run: make lint

      - name: Run Tests
        run: make test

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./superwizor-backend
        
    permissions:
      contents: 'read'
      id-token: 'write'
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'superwizor-backend/go.work'
          cache-dependency-path: 'superwizor-backend/**/go.sum'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: |
          go install github.com/bufbuild/buf/cmd/buf@latest

      - name: Generate Protobuf
        run: buf generate proto/

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker Auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Migrator image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-migrator"
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f services/migrator/Dockerfile .
          docker push -a $IMAGE_PATH

      - name: Build and Push API image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f services/api/Dockerfile .
          docker push -a $IMAGE_PATH

      - name: Build and Push Identity image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-identity"
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f services/identity-svc/Dockerfile .
          docker push -a $IMAGE_PATH

      - name: Build and Push Clinical image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-clinical"
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f services/clinical-svc/Dockerfile .
          docker push -a $IMAGE_PATH

      - name: Build and Push AI Pipeline image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-ai-pipeline"
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f services/ai-pipeline-svc/Dockerfile .
          docker push -a $IMAGE_PATH

      - name: Build and Push Billing image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-billing"
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f services/billing-svc/Dockerfile .
          docker push -a $IMAGE_PATH

      - name: Build and Push Ingestion image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-ingestion"
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f services/ingestion-svc/Dockerfile .
          docker push -a $IMAGE_PATH

      - name: Build and Push Notification image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-notification"
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f services/notification-svc/Dockerfile .
          docker push -a $IMAGE_PATH

      - name: Deploy and Run Migration Job
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-migrator:${{ github.sha }}"
          gcloud run jobs deploy db-migrator \
            --image $IMAGE_PATH \
            --region ${{ env.REGION }} \
            --vpc-connector swvpc-connector \
            --command="" \
            --args="" \
            --set-secrets="DATABASE_URL=postgres-database-url:latest"

          gcloud run jobs execute db-migrator --region ${{ env.REGION }} --wait

      # ────────────────────────────────────────────────────────────────────
      # Cloud Run deploys.
      #
      # PUBLIC services (api / identity / clinical / ingestion / billing):
      #   - --allow-unauthenticated implicitly binds allUsers→roles/run.invoker
      #     at deploy time.
      #   - We ALSO call `add-iam-policy-binding` explicitly after each deploy
      #     as belt-and-suspenders. Idempotent — if the binding already
      #     exists, gcloud returns 0 with no change. This caught regressions
      #     where --allow-unauthenticated silently failed to set IAM and the
      #     Flutter app started getting HTML 401s from the Cloud Run
      #     frontend (see commit history).
      #   - Terraform also pins the same binding in
      #     infra/environments/staging/service-accounts.tf::public_invoker
      #     so any drift from manual `gcloud run services remove-iam-policy
      #     -binding` gets caught on next `terragrunt apply`.
      #   - billing-svc IS browser-facing (the /account/ Subskrypcja card and
      #     /admin/* call it directly via Connect-Web). It was previously
      #     mis-classified as internal + deployed --no-allow-unauthenticated,
      #     which 403'd the anonymous CORS preflight at the GFE and ALSO
      #     reverted the allUsers binding on every deploy. App-layer auth
      #     (Firebase token via ConnectAuthInterceptor) still gates real
      #     access. See docs/agents/11_web_deploy_invoker_drift.md.
      #
      # INTERNAL services (ai-pipeline / stt-worker / llm-worker):
      #   - --no-allow-unauthenticated; only specific calling SAs can invoke.
      #   - Terraform manages those SA bindings in service-accounts.tf.
      # ────────────────────────────────────────────────────────────────────

      - name: Deploy API to Cloud Run
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          gcloud run deploy api-service \
            --image $IMAGE_PATH:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --vpc-connector swvpc-connector \
            --set-env-vars="ENV=staging"
          gcloud run services add-iam-policy-binding api-service \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --member=allUsers --role=roles/run.invoker

      - name: Deploy Identity to Cloud Run
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-identity"
          # Dedicated SA (least privilege: cloudsql.client + secretAccessor
          # on postgres-database-url). Replaces the default Compute SA per
          # Slice 1 of feat/web-app (docs/18 R6, P2 Zero-Trust).
          #
          # NOTIFICATION_SVC_URL points identity-svc at notification-svc
          # so InviteTherapist can dispatch real Resend emails. Without
          # this env the handler falls back to the NoopEmailSender —
          # invites still create DB rows but no email is sent.
          NOTIFICATION_URL=$(gcloud run services describe notification-svc --region ${{ env.REGION }} --format 'value(status.url)' || echo "")
          ACCEPT_BASE="${ACCEPT_URL_BASE:-https://app.superwizor.ai}"
          gcloud run deploy identity-svc \
            --image $IMAGE_PATH:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --use-http2 \
            --vpc-connector swvpc-connector \
            --service-account=identity-svc@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --set-secrets="DATABASE_URL=postgres-database-url:latest" \
            --set-env-vars="GCP_PROJECT_ID=${{ env.PROJECT_ID }},VERSION=${{ github.sha }},NOTIFICATION_SVC_URL=${NOTIFICATION_URL},ACCEPT_URL_BASE=${ACCEPT_BASE}"
          gcloud run services add-iam-policy-binding identity-svc \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --member=allUsers --role=roles/run.invoker

      - name: Deploy Clinical to Cloud Run
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-clinical"
          # Identity SVC URL is needed by clinical-svc at startup for inter-service calls.
          IDENTITY_URL=$(gcloud run services describe identity-svc --region ${{ env.REGION }} --format 'value(status.url)' || echo "")
          if [ -z "$IDENTITY_URL" ]; then
            echo "Identity URL not available yet, deploying without it or it will fail on start."
          fi

          # Dedicated SA + KMS_KEY_URI: clinical-svc decrypts report_ciphertext
          # and text_ciphertext columns. Without KMS_KEY_URI it silently falls
          # back to cryptobox.NewMockBox(), which can't decrypt real KMS-wrapped
          # DEKs — handler swallows the error and GetSessionDetails returns an
          # empty Reports array.
          KMS_KEY_URI="projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/keyRings/superwizor-keyring/cryptoKeys/app-data-key"
          # BILLING_SVC_URL — read by clinical-svc.GetMyBillingState
          # proxy (feat/billing-svc-refactor phase B). Without it the
          # handler returns Unavailable and Flutter can't render the
          # quota banner. Previously set via gcloud after each CI run;
          # adding it here so --set-env-vars (which REPLACES the env
          # block) preserves it on every deploy.
          BILLING_SVC_URL="https://billing-svc-e3f32b232q-lm.a.run.app"
          # NOTIFICATION_SVC_URL — read by clinical-svc.SavePatientNote to send
          # the patient action-plan e-mail (docs/22). notification-svc already
          # exists; resolve its URL. Without it the send path returns Unavailable
          # and the note is saved-only.
          NOTIFICATION_URL=$(gcloud run services describe notification-svc --region ${{ env.REGION }} --format 'value(status.url)' || echo "")
          gcloud run deploy clinical-svc \
            --image $IMAGE_PATH:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --use-http2 \
            --service-account=clinical-svc@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --vpc-connector swvpc-connector \
            --set-secrets="DATABASE_URL=postgres-database-url:latest" \
            --set-env-vars="IDENTITY_SVC_URL=${IDENTITY_URL},VERSION=${{ github.sha }},KMS_KEY_URI=${KMS_KEY_URI},BILLING_SVC_URL=${BILLING_SVC_URL},NOTIFICATION_SVC_URL=${NOTIFICATION_URL}"
          gcloud run services add-iam-policy-binding clinical-svc \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --member=allUsers --role=roles/run.invoker

      - name: Deploy Ingestion to Cloud Run
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-ingestion"
          # BILLING_SVC_URL — read by ingestion-svc.reserveCreditOrBlock
          # (feat/billing-svc). Without it the billing client is nil
          # and CreateAudioUpload skips the quota gate entirely, so
          # over-quota sessions slip through. Previously set via
          # gcloud after each CI run; adding here so --set-env-vars
          # (which REPLACES the env block) preserves it.
          BILLING_SVC_URL="https://billing-svc-e3f32b232q-lm.a.run.app"
          gcloud run deploy ingestion-svc \
            --image $IMAGE_PATH:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --use-http2 \
            --service-account=ingestion-svc@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --vpc-connector swvpc-connector \
            --vpc-egress private-ranges-only \
            --min-instances 1 \
            --max-instances 20 \
            --cpu 2 \
            --memory 2Gi \
            --no-cpu-throttling \
            --set-secrets="DATABASE_URL=postgres-database-url:latest" \
            --set-env-vars="GCP_PROJECT_ID=${{ env.PROJECT_ID }},AUDIO_BUCKET_NAME=${{ env.PROJECT_ID }}-audio-uploads,VERSION=${{ github.sha }},GCS_FINALIZE_SUB_ID=audio.objectFinalized.sub,BILLING_SVC_URL=${BILLING_SVC_URL}"
          # CPU/memory + --no-cpu-throttling are required for Option F
          # (feat/refactor-stt-architecture, 2026-05-25): the in-process
          # Pub/Sub pull subscriber goroutine runs ffprobe + ffmpeg
          # silence-detect on long audio uploads. Default CPU-throttled
          # Cloud Run starves the goroutine once the gRPC request that
          # spawned the instance ends → message ack-deadline elapses
          # → Pub/Sub redelivers indefinitely. Always-allocated CPU
          # keeps the goroutine alive between requests. See
          # docs/15_HYBRID_EVENTARC_FINALIZATION.md.
          gcloud run services add-iam-policy-binding ingestion-svc \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --member=allUsers --role=roles/run.invoker

      - name: Deploy Notification to Cloud Run
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-notification"
          # Phase 3 Flutter-facing service: Cloud Run gRPC server for
          # RegisterFCMToken / RemoveFCMToken / GetUnreadCount.
          # GCP_PROJECT_ID is required for Firebase Admin Auth ID-token
          # verification — without it, every authenticated RPC returns
          # UNAUTHENTICATED ("auth client not configured"). The
          # notification-svc SA owns the runtime IAM (datastore.user, fcm
          # sender, sql client, secret accessor) — see
          # infra/environments/staging/service-accounts.tf.
          # RESEND_API_KEY is mounted from Secret Manager. The secret is
          # created out-of-band (gcloud secrets create resend-api-key);
          # the notification-svc SA needs roles/secretmanager.secret-
          # Accessor on it (granted in service-accounts.tf in a follow-up).
          # If the secret doesn't exist yet the deploy fails — wire the
          # secret BEFORE merging this commit to main.
          gcloud run deploy notification-svc \
            --image $IMAGE_PATH:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --use-http2 \
            --service-account=notification-svc@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --vpc-connector swvpc-connector \
            --set-secrets="DATABASE_URL=postgres-database-url:latest,RESEND_API_KEY=resend-api-key:latest" \
            --set-env-vars="GCP_PROJECT_ID=${{ env.PROJECT_ID }},VERSION=${{ github.sha }},RESEND_FROM=Superwizor <noreply@superwizor.ai>"
          gcloud run services add-iam-policy-binding notification-svc \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --member=allUsers --role=roles/run.invoker

      - name: Deploy AI Pipeline to Cloud Run
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-ai-pipeline"

          gcloud run deploy ai-pipeline-svc \
            --image $IMAGE_PATH:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --no-allow-unauthenticated \
            --vpc-connector swvpc-connector \
            --set-secrets="DATABASE_URL=postgres-database-url:latest" \
            --set-env-vars="GCP_PROJECT_ID=${{ env.PROJECT_ID }},VERSION=${{ github.sha }}"

      - name: Deploy Billing to Cloud Run
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-billing"

          # IDENTITY_SVC_URL — billing-svc's ConnectAuthInterceptor calls
          # identity-svc.ValidateToken to turn a browser Firebase ID token
          # into the x-superwizor-role metadata the admin handlers need.
          # Without this env the interceptor is DISABLED and every browser
          # admin RPC (AdminResetTokens/AdminChangePlan) 401s as
          # "Unauthenticated" → UI shows "Musisz być zalogowana/y".
          # --set-env-vars REPLACES the whole env block, so it MUST be
          # listed here or it gets wiped on every deploy.
          IDENTITY_URL=$(gcloud run services describe identity-svc --region ${{ env.REGION }} --format 'value(status.url)' || echo "")

          # --allow-unauthenticated: billing-svc is browser-facing (the
          # /account/ Subskrypcja card + /admin/* call it directly). The
          # anonymous CORS preflight (OPTIONS, no Authorization header) is
          # 403'd by the Google Frontend unless allUsers has run.invoker,
          # which surfaces as the opaque "Wystąpił nieznany błąd". Real
          # user identity is still enforced at the app layer via the
          # Firebase token. (Was --no-allow-unauthenticated, which silently
          # reverted the IAM fix on every deploy — see
          # docs/agents/11_web_deploy_invoker_drift.md.)
          gcloud run deploy billing-svc \
            --image $IMAGE_PATH:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --vpc-connector swvpc-connector \
            --use-http2 \
            --set-env-vars="GCP_PROJECT_ID=${{ env.PROJECT_ID }},VERSION=${{ github.sha }},IDENTITY_SVC_URL=${IDENTITY_URL}"
          # Belt-and-braces parity with identity/clinical: pin allUsers
          # explicitly so the public invoker can't drift even if a future
          # deploy flag changes.
          gcloud run services add-iam-policy-binding billing-svc \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --member=allUsers --role=roles/run.invoker
