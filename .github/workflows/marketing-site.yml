name: marketing-site

# Builds and deploys the Next.js marketing site to Firebase Hosting
# (site: superwizor-www). Fires only when marketing-site/ or its shared
# inputs (proto-ts package, root firebase.json) change — keeps the
# existing backend pipeline (ci.yml) unaffected.

on:
  push:
    branches:
      - main
      # Slice branches deploy to the preview channel automatically — see
      # the `firebase-hosting-channel-deploy` action below.
      - "feat/web-app-**"
    paths:
      - "marketing-site/**"
      - "superwizor-backend/gen/ts/**"
      - "firebase.json"
      - ".github/workflows/marketing-site.yml"
  pull_request:
    paths:
      - "marketing-site/**"
      - "superwizor-backend/gen/ts/**"

permissions:
  contents: read
  pull-requests: write
  checks: write
  # Required for google-github-actions/auth to mint Workload-Identity
  # short-lived tokens. The service-account itself (with hosting deploy
  # perms) is provisioned via terraform — see infra/staging.
  id-token: write

# Public build-time client config for `next build`. These are all
# NEXT_PUBLIC_* values — by definition they are compiled into the browser
# bundle and are NOT secrets (publishable Stripe key, public Firebase web
# config, public Cloud Run URLs, reCAPTCHA site key). They previously lived
# in a committed marketing-site/.env.production, which the security pass
# (#4) removed alongside the real DB-password secret. Without them `next
# build` falls back to the localhost defaults in src/lib/connect/transport.ts
# and production login breaks (identity RPCs hit http://localhost:8080). A
# top-level env block feeds every `pnpm build` in this workflow (build /
# deploy-preview / deploy-production). The genuine secret (STRIPE_SECRET_KEY)
# stays in billing-svc via GCP Secret Manager.
env:
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_51TREGgE5jzWcAIgeQMblLii1r6vCXqalB3DjPrJ0mKUvQcmLADV3G2jn4Rf73uG4X4j9QWA6CzagOnDaB7LBzFck00jH7yjjAW
  NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAggOO0mf-HDhQBI8boIgUSlipjmha2p5w
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: superwizor-ai-25ecd.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: superwizor-ai-25ecd
  NEXT_PUBLIC_FIREBASE_APP_ID: "1:344724821207:web:3e2ca4d5fcfdc640a98c92"
  NEXT_PUBLIC_IDENTITY_URL: https://identity-svc-344724821207.europe-central2.run.app
  NEXT_PUBLIC_BILLING_URL: https://billing-svc-344724821207.europe-central2.run.app
  NEXT_PUBLIC_CLINICAL_URL: https://clinical-svc-344724821207.europe-central2.run.app
  NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_KEY: 6Lc7pxstAAAAANhbK7gIedSlbY5cWwrI7zXc_3BQ

jobs:
  build:
    name: build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('marketing-site/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install deps
        working-directory: marketing-site
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: marketing-site
        run: pnpm lint || echo "::warning::lint reported issues (non-blocking until Slice 6)"

      # docs/18 §13.11 — locale parity gate. Fails the build when
      # pl.json and en.json drift apart so we don't ship half-translated
      # strings to production. See scripts/check-l10n-parity.mjs.
      - name: l10n parity (PL ↔ EN)
        working-directory: marketing-site
        run: pnpm run check:l10n

      - name: Build
        working-directory: marketing-site
        run: pnpm build

      - name: Connect-RPC client smoke
        working-directory: marketing-site
        run: pnpm exec tsx scripts/smoke-connect.mjs

  deploy-preview:
    name: Firebase Hosting preview (PR or feature branch)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feat/web-app-')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install deps
        working-directory: marketing-site
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: marketing-site
        run: pnpm build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Firebase Hosting preview channel deploy
        run: firebase hosting:channel:deploy pr-${{ github.event.pull_request.number || github.ref_name }} --only superwizor --project superwizor-ai-25ecd

  deploy-production:
    name: Firebase Hosting production (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-www
      url: https://superwizor.ai

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install deps
        working-directory: marketing-site
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: marketing-site
        run: pnpm build
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_live_51TREGXEA7Lw46kANncQ52Z2vxfDEBYTJf5cU7x6ItJBxENQxuGZwpDe12RHh1IfXR8T6d8cHBJ8oc7wOxhiXxSWmz

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Firebase Hosting production deploy
        run: firebase deploy --only hosting:superwizor --project superwizor-ai-25ecd
