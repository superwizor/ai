name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-central2
  REPOSITORY: services
  IMAGE_NAME: superwizor-api
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./superwizor-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'superwizor-backend/go.work'
          cache-dependency-path: 'superwizor-backend/**/go.sum'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: |
          go install github.com/bufbuild/buf/cmd/buf@latest
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin latest

      - name: Lint Protobuf
        run: buf lint proto/

      - name: Generate Protobuf
        run: buf generate proto/

      - name: Lint Go
        run: make lint

      - name: Run Tests
        run: make test

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./superwizor-backend
        
    permissions:
      contents: 'read'
      id-token: 'write'
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'superwizor-backend/go.work'
          cache-dependency-path: 'superwizor-backend/**/go.sum'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: |
          go install github.com/bufbuild/buf/cmd/buf@latest

      - name: Generate Protobuf
        run: buf generate proto/

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker Auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Migrator image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-migrator"
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f services/migrator/Dockerfile .
          docker push -a $IMAGE_PATH

      - name: Build and Push API image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f services/api/Dockerfile .
          docker push -a $IMAGE_PATH

      - name: Build and Push Identity image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-identity"
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f services/identity-svc/Dockerfile .
          docker push -a $IMAGE_PATH

      - name: Build and Push Clinical image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-clinical"
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f services/clinical-svc/Dockerfile .
          docker push -a $IMAGE_PATH

      - name: Build and Push Billing image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-billing"
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f services/billing-svc/Dockerfile .
          docker push -a $IMAGE_PATH

      - name: Build and Push Ingestion image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-ingestion"
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f services/ingestion-svc/Dockerfile .
          docker push -a $IMAGE_PATH

      - name: Build and Push AI Pipeline image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-ai-pipeline"
          docker build -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest -f services/ai-pipeline-svc/Dockerfile .
          docker push -a $IMAGE_PATH

      - name: Deploy and Run Migration Job
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-migrator:${{ github.sha }}"
          gcloud run jobs deploy db-migrator \
            --image $IMAGE_PATH \
            --region ${{ env.REGION }} \
            --vpc-connector swvpc-connector \
            --command="" \
            --args="" \
            --set-secrets="DATABASE_URL=postgres-database-url:latest"

          gcloud run jobs execute db-migrator --region ${{ env.REGION }} --wait

      - name: Deploy API to Cloud Run
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          gcloud run deploy api-service \
            --image $IMAGE_PATH:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --vpc-connector swvpc-connector \
            --set-env-vars="ENV=staging"

      - name: Deploy Identity to Cloud Run
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-identity"
          gcloud run deploy identity-svc \
            --image $IMAGE_PATH:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --vpc-connector swvpc-connector \
            --set-secrets="DATABASE_URL=postgres-database-url:latest" \
            --set-env-vars="GCP_PROJECT_ID=${{ env.PROJECT_ID }},VERSION=${{ github.sha }}"

      - name: Deploy Clinical to Cloud Run
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-clinical"
          # Get Identity SVC URL
          IDENTITY_URL=$(gcloud run services describe identity-svc --region ${{ env.REGION }} --format 'value(status.url)' || echo "")
          if [ -z "$IDENTITY_URL" ]; then
            echo "Identity URL not available yet, deploying without it or it will fail on start."
          fi

          gcloud run deploy clinical-svc \
            --image $IMAGE_PATH:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --vpc-connector swvpc-connector \
            --set-secrets="DATABASE_URL=postgres-database-url:latest" \
            --set-env-vars="IDENTITY_SVC_URL=${IDENTITY_URL},VERSION=${{ github.sha }}"

      - name: Deploy Billing to Cloud Run
        # Internal gRPC service (called by clinical-svc). Stub in Phase 2.
        # Preserves IAM policy (no --allow-unauthenticated / --no-allow-unauthenticated).
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-billing"
          gcloud run deploy billing-svc \
            --image $IMAGE_PATH:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --vpc-connector swvpc-connector \
            --vpc-egress private-ranges-only \
            --set-env-vars="GCP_PROJECT_ID=${{ env.PROJECT_ID }},VERSION=${{ github.sha }}" \
            --use-http2

      - name: Deploy Ingestion to Cloud Run
        # Public-facing audio upload API. Uses dedicated ingestion-svc SA so it
        # can sign GCS upload URLs and publish to Pub/Sub.
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-ingestion"
          gcloud run deploy ingestion-svc \
            --image $IMAGE_PATH:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --service-account=ingestion-svc@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --vpc-connector swvpc-connector \
            --vpc-egress private-ranges-only \
            --min-instances 1 \
            --max-instances 20 \
            --set-secrets="DATABASE_URL=postgres-database-url:latest" \
            --set-env-vars="GCP_PROJECT_ID=${{ env.PROJECT_ID }},AUDIO_BUCKET_NAME=${{ env.PROJECT_ID }}-audio-uploads,VERSION=${{ github.sha }}"

      - name: Deploy AI Pipeline to Cloud Run
        # gRPC server side of the AI pipeline. The actual stt-worker / llm-worker
        # Cloud Functions are deployed by Terraform separately.
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/superwizor-ai-pipeline"
          gcloud run deploy ai-pipeline-svc \
            --image $IMAGE_PATH:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --vpc-connector swvpc-connector \
            --vpc-egress private-ranges-only \
            --set-secrets="DATABASE_URL=postgres-database-url:latest" \
            --set-env-vars="GCP_PROJECT_ID=${{ env.PROJECT_ID }},VERSION=${{ github.sha }}"
