<!DOCTYPE html>
<html lang="{{lang}}" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>{{subject}}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#111113;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;">
  <!-- Outer wrapper — full-width dark bg -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#111113;">
    <tr>
      <td align="center" style="padding:40px 16px 32px;">

        <!-- Card container — max 560px -->
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;background-color:#1a1a1e;border-radius:16px;overflow:hidden;">

          <!-- Top gradient accent bar -->
          <tr>
            <td style="height:4px;background:linear-gradient(90deg,#d4a853 0%,#e8c776 50%,#d4a853 100%);font-size:0;line-height:0;">&nbsp;</td>
          </tr>

          <!-- Logo section -->
          <tr>
            <td align="center" style="padding:32px 40px 8px;">
              <img src="https://superwizor.ai/superwizor-logo-512.png" alt="Superwizor AI" width="56" height="56" style="display:block;border:0;border-radius:12px;width:56px;height:56px;">
            </td>
          </tr>

          <!-- Heading -->
          <tr>
            <td align="center" style="padding:12px 40px 0;">
              <h1 style="margin:0;font-size:22px;font-weight:600;color:#f5f5f5;line-height:1.35;">
                {{heading}}
              </h1>
            </td>
          </tr>

          <!-- Body copy -->
          <tr>
            <td style="padding:16px 40px 0;">
              <p style="margin:0 0 12px;font-size:15px;line-height:1.6;color:#a0a0a8;">
                {{greeting}}
              </p>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#a0a0a8;">
                {{body_text}}
              </p>
            </td>
          </tr>

          <!-- CTA Button -->
          <tr>
            <td align="center" style="padding:0 40px 8px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="background:linear-gradient(135deg,#d4a853 0%,#c49a3f 100%);border-radius:10px;">
                    <a href="{{verify_url}}" target="_blank" style="display:inline-block;padding:14px 40px;font-size:15px;font-weight:600;color:#111113;text-decoration:none;letter-spacing:0.3px;border-radius:10px;">
                      {{cta_text}}
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Subtle divider -->
          <tr>
            <td style="padding:24px 40px 0;">
              <div style="height:1px;background-color:#2a2a2e;"></div>
            </td>
          </tr>

          <!-- Fallback URL (in case button doesn't render) -->
          <tr>
            <td style="padding:16px 40px 0;">
              <p style="margin:0;font-size:12px;line-height:1.5;color:#666670;">
                {{fallback_label}}
              </p>
              <p style="margin:4px 0 0;font-size:12px;line-height:1.5;word-break:break-all;">
                <a href="{{verify_url}}" style="color:#d4a853;text-decoration:underline;">{{verify_url}}</a>
              </p>
            </td>
          </tr>

          <!-- Safety note -->
          <tr>
            <td style="padding:20px 40px 0;">
              <p style="margin:0;font-size:12px;line-height:1.5;color:#555560;">
                {{safety_note}}
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 40px 32px;">
              <p style="margin:0;font-size:12px;line-height:1.5;color:#555560;">
                {{sign_off}}<br>
                <span style="color:#888890;">{{team_name}}</span>
              </p>
            </td>
          </tr>

        </table>
        <!-- /Card -->

        <!-- Sub-footer: unsubscribe / address -->
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;">
          <tr>
            <td align="center" style="padding:20px 40px 8px;">
              <p style="margin:0;font-size:11px;line-height:1.5;color:#444450;">
                Euphire sp. z o.o. · Warszawa, Polska
              </p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
