<!DOCTYPE html>
<html lang="{{lang}}" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>{{subject}}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#ffffff;font-family:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
    <tr>
      <td align="center" style="padding:40px 16px 32px;">

        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;background-color:#004D54;background:linear-gradient(180deg, #004D54 0%, #002E32 100%);border:1px solid #002E32;border-radius:16px;overflow:hidden;">

          <!-- Accent bar -->
          <tr>
            <td style="height:4px;background:#FCAE2F;font-size:0;line-height:0;">&nbsp;</td>
          </tr>

          <!-- Icon/Logo -->
          <tr>
            <td align="left" style="padding:40px 40px 0;">
              <img src="https://superwizor.ai/superwizor-logo-512.png" alt="Superwizor AI" width="56" height="56" style="display:block;border:0;border-radius:12px;width:56px;height:56px;">
            </td>
          </tr>

          <!-- Heading / Subject line -->
          <tr>
            <td align="left" style="padding:24px 40px 0;">
              <h1 style="margin:0;font-size:24px;font-weight:600;color:#F3F4F6;line-height:1.35;">
                {{heading}}
              </h1>
            </td>
          </tr>

          <!-- Body content (with paragraphs, formatting, lists) -->
          <tr>
            <td align="left" style="padding:24px 40px 0;font-size:16px;font-weight:400;color:#D1D5DB;line-height:1.6;">
              {{body_html}}
            </td>
          </tr>

          <!-- Optional CTA Button & Fallback section -->
          {{cta_section}}

          <!-- Optional Safety Note / Footnote -->
          {{safety_section}}

          <!-- Spacing before footer -->
          <tr>
            <td style="height:40px;font-size:0;line-height:0;">&nbsp;</td>
          </tr>

        </table>

        <!-- Footer company info -->
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;">
          <tr>
            <td align="center" style="padding:24px 40px 8px;">
              <p style="margin:0;font-size:12px;font-weight:400;color:#4B5563;line-height:1.5;">
                {{sign_off}} <span style="color:#004D54;font-weight:600;">{{team_name}}</span>
              </p>
              <p style="margin:8px 0 0;font-size:12px;font-weight:400;color:#4B5563;line-height:1.5;">
                Superwizor.ai · Kraków, Polska
              </p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
