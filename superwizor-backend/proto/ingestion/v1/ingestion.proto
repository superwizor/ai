syntax = "proto3";

package ingestion.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/superwizor-ai/backend/gen/go/ingestion/v1;ingestionv1";

// IngestionService — secure upload door for therapist audio.
//
// As of 2026-05-25 (Option F, hybrid Eventarc-driven async ingestion
// finalization on `feat/refactor-stt-architecture`), the upload flow
// is a clean two-RPC contract:
//
//   1. CreateAudioUpload  → signed URL + session_id (PENDING_UPLOAD)
//   2. PUT to GCS         → bucket notification fires
//                           audio.objectFinalized topic; ingestion-svc's
//                           in-process subscriber probes duration,
//                           transcodes if needed, chunks if > 19 min,
//                           flips session to CREATED, publishes
//                           audio.uploaded for STT.
//
// The legacy `CompleteAudioUpload` and `ConvertAudio` RPCs were
// REMOVED in the same change — they're entirely server-side now,
// triggered by the bucket notification. Pre-launch, so no
// deprecation window; Flutter terminates uploads at `phase=completed`
// the moment the HTTP PUT returns 2xx. See
// `docs/15_HYBRID_EVENTARC_FINALIZATION.md` for the design.
service IngestionService {
  // Issues a V4 signed URL the client uses to PUT audio directly
  // to GCS, and creates the session row in PENDING_UPLOAD state.
  rpc CreateAudioUpload(CreateAudioUploadRequest) returns (CreateAudioUploadResponse);

  // Polling helper for the upload row state. Rarely needed now that
  // the Firestore session_states mirror is the canonical client
  // status feed, but kept for debugging + the existing pending-uploads
  // screen on Flutter.
  rpc GetAudioUploadStatus(GetAudioUploadStatusRequest) returns (AudioUploadStatus);
}

message CreateAudioUploadRequest {
  string therapist_id = 1;
  string patient_file_id = 2;
  string content_type = 3;        // 'audio/flac', 'audio/m4a', 'audio/wav', ...
  int64 estimated_size_bytes = 4;
  int32 estimated_duration_seconds = 5;
  string idempotency_key = 6;
  string client_app_version = 7;
  string client_platform = 8;
  string report_language = 9;     // 'pl', 'en', 'de', etc.
}

message CreateAudioUploadResponse {
  string upload_id = 1;
  string signed_url = 2;          // PUT URL z Cloud Storage
  google.protobuf.Timestamp signed_url_expires_at = 3;
  string object_path = 4;
  map<string, string> required_headers = 5;  // x-goog-content-md5, etc.
  // session_id assigned at upload-creation time (Option E,
  // 2026-05-25). Sessions table now has a row in PENDING_UPLOAD
  // status from this point. Lets Flutter render the kartoteka
  // entry immediately rather than waiting on async finalize.
  string session_id = 6;

  // ── Resumable upload (docs/26 PR1) ──────────────────────────────
  // GCS resumable session endpoint the client PUTs byte-range chunks to
  // (Content-Range), resuming across network drops instead of restarting
  // the whole object. Empty when the server couldn't start a resumable
  // session — clients then fall back to signed_url (single PUT).
  string resumable_session_uri = 7;
  // ~7-day session lifetime (advisory; clients rely on GCS 404/410 to
  // detect a dead session and re-create via the same idempotency_key).
  google.protobuf.Timestamp resumable_session_expires_at = 8;
  // Suggested chunk size (multiple of 256 KiB; e.g. 8 MiB). Clients may clamp.
  int64 recommended_chunk_size_bytes = 9;
}

message GetAudioUploadStatusRequest {
  string upload_id = 1;
}

message AudioUploadStatus {
  string upload_id = 1;
  string status = 2;              // PENDING, UPLOADED, PROCESSING, FAILED, EXPIRED
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  string error_message = 5;
}
