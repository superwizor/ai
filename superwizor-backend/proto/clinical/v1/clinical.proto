syntax = "proto3";

package clinical.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/superwizor-ai/backend/gen/go/clinical/v1;clinicalv1";

service ClinicalService {
    rpc CreatePatientFile(CreatePatientFileRequest) returns (PatientFile);
    rpc GetPatientFile(GetPatientFileRequest) returns (PatientFile);
    rpc ListPatientFiles(ListPatientFilesRequest) returns (ListPatientFilesResponse);
    rpc UpdatePatientFile(UpdatePatientFileRequest) returns (PatientFile);
    // Hard delete since 000012 — cascades through all sessions / transcripts /
    // reports / audio_uploads. PHI gone permanently (RODO right-to-erasure).
    rpc DeletePatientFile(DeletePatientFileRequest) returns (google.protobuf.Empty);

    rpc ListModalities(google.protobuf.Empty) returns (ListModalitiesResponse);
    rpc HealthCheck(google.protobuf.Empty) returns (HealthCheckResponse);
    rpc UpdateSpeakerLabels(UpdateSpeakerLabelsRequest) returns (UpdateSpeakerLabelsResponse);

    // Sessions and Analysis
    rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
    rpc GetSessionDetails(GetSessionDetailsRequest) returns (GetSessionDetailsResponse);
    // Rename a single session — currently only `name` is mutable.
    rpc UpdateSession(UpdateSessionRequest) returns (Session);
    // Hard delete a single session — cascades transcripts/reports/hitop.
    // Publishes session.deleted Pub/Sub event for downstream Firestore +
    // inbox cleanup.
    rpc DeleteSession(DeleteSessionRequest) returns (google.protobuf.Empty);
}

enum ProcessType {
    PROCESS_TYPE_UNSPECIFIED = 0;
    PROCESS_TYPE_INDIVIDUAL = 1;
    PROCESS_TYPE_COUPLE = 2;
    PROCESS_TYPE_FAMILY = 3;
    PROCESS_TYPE_GROUP = 4;
}

message PatientFile {
    string id = 1;
    string therapist_id = 2;
    string patient_id = 3;
    string modality_id = 4;
    string modality_code = 5; // resolved
    string working_alias = 6;
    ProcessType process_type = 7;
    string initial_complaint = 8;
    bool is_process_closed = 9;
    bool has_recording_consent = 10;
    google.protobuf.Timestamp consent_given_at = 11;
    google.protobuf.Timestamp first_consultation_at = 12;
    string private_therapist_notes = 13;
    google.protobuf.Timestamp created_at = 14;
    google.protobuf.Timestamp updated_at = 15;
}

message Modality {
    string id = 1;
    string system_code = 2;
    string display_name = 3;
    bool is_supported = 4;
}

message CreatePatientFileRequest {
    string therapist_id = 1; // walidowany przeciw token JWT
    string modality_code = 2; // "CBT", "PSYCHO", "UNIV"
    string working_alias = 3;
    ProcessType process_type = 4;
    string initial_complaint = 5;
    bool has_recording_consent = 6;
    string idempotency_key = 7;
}

message GetPatientFileRequest {
    string patient_file_id = 1;
}

message ListPatientFilesRequest {
    string therapist_id = 1;
    int32 page_size = 2;
    string page_token = 3;
}

message ListPatientFilesResponse {
    repeated PatientFile patient_files = 1;
    string next_page_token = 2;
}

message UpdatePatientFileRequest {
    string patient_file_id = 1;
    string working_alias = 2;
    string initial_complaint = 3;
    string private_therapist_notes = 4;
    bool is_process_closed = 5;
}

message DeletePatientFileRequest {
    string patient_file_id = 1;
}

message ListModalitiesResponse {
    repeated Modality modalities = 1;
}

message HealthCheckResponse {
    string status = 1;
    string version = 2;
}

message UpdateSpeakerLabelsRequest {
  string session_id = 1;
  // Mapping: speaker_tag (jako string "1", "2", "3") → nowy label
  // Przykład: {"1": "Anna Kowalska", "2": "Marek Kowalski"}
  map<string, string> label_mapping = 2;
}

message UpdateSpeakerLabelsResponse {
  string session_id = 1;
  string transcript_id = 2;
  int32 segments_updated = 3;
  bool blob_rebuilt = 4;
}

message Session {
  string id = 1;
  string therapist_id = 2;
  string patient_file_id = 3;
  string audio_upload_id = 4;
  string session_date = 5;
  int32 session_number = 6;
  int32 duration_seconds = 7;
  string contact_form = 8;
  map<string, string> speaker_label_mapping = 9;
  string status = 10;
  google.protobuf.Timestamp created_at = 11;
  // Free-text label shown in the kartoteka list. Default at create-time:
  // "<modality display_name> <session_number>". Therapist can rename via
  // ClinicalService.UpdateSession. Migration 000011 added the column;
  // ingestion-svc.CompleteAudioUpload populates it on new sessions.
  string name = 12;
}

message ListSessionsRequest {
  string patient_file_id = 1;
}

// UpdateSession — rename a session. Currently `name` is the only
// mutable field; add more here as edit needs surface (e.g. session_date
// correction). Empty `name` is rejected by the handler.
message UpdateSessionRequest {
  string session_id = 1;
  string name = 2;
}

// DeleteSession — hard delete via CASCADE (migration 000012).
// Removes transcripts, reports, hitop_measurements, audio_uploads
// rows referencing this session. Publishes session.deleted Pub/Sub
// event so notification-svc can purge the Firestore mirror + inbox.
message DeleteSessionRequest {
  string session_id = 1;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message TranscriptSegment {
  int32 speaker_tag = 1;
  string speaker_label = 2;
  int32 start_offset_ms = 3;
  int32 end_offset_ms = 4;
  string text = 5;
  float confidence = 6;
}

message Transcript {
  string id = 1;
  repeated TranscriptSegment segments = 2;
}

message Report {
  string id = 1;
  string title = 2;
  string summary_short = 3;
  string content = 4;
  string sentiment_label = 5;
  string risk_level = 6;
}

message GetSessionDetailsRequest {
  string session_id = 1;
}

message GetSessionDetailsResponse {
  Session session = 1;
  Transcript transcript = 2;
  repeated Report reports = 3;
}
