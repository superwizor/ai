syntax = "proto3";

package clinical.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "billing/v1/billing.proto";

option go_package = "github.com/superwizor-ai/backend/gen/go/clinical/v1;clinicalv1";

service ClinicalService {
    rpc CreatePatientFile(CreatePatientFileRequest) returns (PatientFile);
    rpc GetPatientFile(GetPatientFileRequest) returns (PatientFile);
    rpc ListPatientFiles(ListPatientFilesRequest) returns (ListPatientFilesResponse);
    rpc UpdatePatientFile(UpdatePatientFileRequest) returns (PatientFile);
    // Hard delete since 000012 — cascades through all sessions / transcripts /
    // reports / audio_uploads. Since 000013 it ALSO drops the paired
    // users(role='PATIENT') row in the same transaction. PHI gone
    // permanently (RODO right-to-erasure).
    rpc DeletePatientFile(DeletePatientFileRequest) returns (google.protobuf.Empty);

    // Patient-user CRUD (added with migration 000013). These are
    // SEPARATE from working_alias / initial_complaint edits — therapist
    // can update one without touching the other.
    rpc UpdatePatientUser(UpdatePatientUserRequest) returns (PatientFile);
    // RODO-style erasure on the patient axis. CASCADEs through every
    // patient_file referencing this user (migration 000014), and from
    // there through sessions / transcripts / reports / etc. Publishes
    // one session.deleted Pub/Sub event per cascaded session for
    // Firestore + inbox cleanup. Nothing left to return → Empty.
    rpc DeletePatientUser(DeletePatientUserRequest) returns (google.protobuf.Empty);

    // Patient notes + action plan (docs/22).
    rpc CreatePatientNote(CreatePatientNoteRequest) returns (PatientNote);
    rpc ListPatientNotes(ListPatientNotesRequest) returns (ListPatientNotesResponse);
    rpc UpdatePatientNote(UpdatePatientNoteRequest) returns (PatientNote);
    rpc DeletePatientNote(DeletePatientNoteRequest) returns (google.protobuf.Empty);
    rpc GetActionPlanDraft(GetActionPlanDraftRequest) returns (ActionPlanDraft);
    rpc SavePatientNote(SavePatientNoteRequest) returns (SavePatientNoteResponse);

    rpc ListModalities(google.protobuf.Empty) returns (ListModalitiesResponse);
    rpc HealthCheck(google.protobuf.Empty) returns (HealthCheckResponse);

    // Thin proxy to billing-svc.GetSubscription, scoped to the
    // calling user's organization. Lets Flutter read the canonical
    // counter snapshot (used / reserved / limit / remaining + plan)
    // without exposing billing-svc directly to public clients.
    // Authentication: identity-svc-validated Firebase JWT (same as
    // every other clinical-svc RPC). Organization is derived from
    // users.organization_id — clients never specify it.
    rpc GetMyBillingState(google.protobuf.Empty) returns (billing.v1.Subscription);

    rpc UpdateSpeakerLabels(UpdateSpeakerLabelsRequest) returns (UpdateSpeakerLabelsResponse);

    // Sessions and Analysis
    rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
    rpc GetSessionDetails(GetSessionDetailsRequest) returns (GetSessionDetailsResponse);
    // Rename a single session — currently only `name` is mutable.
    rpc UpdateSession(UpdateSessionRequest) returns (Session);
    // Hard delete a single session — cascades transcripts/reports/hitop.
    // Publishes session.deleted Pub/Sub event for downstream Firestore +
    // inbox cleanup.
    rpc DeleteSession(DeleteSessionRequest) returns (google.protobuf.Empty);
    // User-initiated cancellation of an IN-PROGRESS session
    // (PENDING_UPLOAD … ANALYZING). Flips status to CANCELLED_BY_USER,
    // releases the held billing reservation, and cancels the
    // audio_uploads row. Hidden from the kartoteka afterward. Idempotent
    // (re-cancel on an already-terminal session returns OK). Rejects
    // COMPLETED sessions — those use DeleteSession. See
    // feat/tokens-exhausted.
    rpc CancelSession(CancelSessionRequest) returns (google.protobuf.Empty);

    // ─── Cross-device preference sync (migration 000059) ───
    // Marks a completed session's report as viewed by the therapist.
    // Idempotent — re-calling on an already-viewed session is a no-op.
    // Replaces the Flutter-local SharedPreferences viewed_reports tracking.
    rpc MarkReportViewed(MarkReportViewedRequest) returns (google.protobuf.Empty);
    // Sets or clears the avatar customization (label + color) on a
    // patient file. Empty avatar_config clears to defaults.
    rpc SetAvatarConfig(SetAvatarConfigRequest) returns (google.protobuf.Empty);

    // ─── Report ratings (docs/10_REPORT_CUSTOMIZATION.md §5) ───
    // 👍/👎 rating on a generated report. Idempotent on
    // (report_id, therapist_id) — re-rating UPSERTs in place.
    rpc RateReport(RateReportRequest) returns (RateReportResponse);
    // Read the current rating (if any) the therapist gave a report.
    // Returns NotFound if unrated.
    rpc GetReportRating(GetReportRatingRequest) returns (ReportRating);
    // Returns a single preference-change suggestion if the therapist's
    // recent ratings warrant one (≥3 negatives of same chip category
    // in last 5 reports). Returns an empty PreferenceSuggestion with
    // empty suggestion_id when no suggestion is active — Flutter
    // hides the banner in that case. Called in parallel with
    // identity-svc.GetReportPreferences on settings entry.
    rpc GetActiveSuggestion(GetActiveSuggestionRequest) returns (PreferenceSuggestion);
    // Records that a suggestion-engine banner was either shown,
    // applied, or dismissed. Telemetry only; safe to fire-and-forget.
    rpc LogPreferenceSuggestion(LogPreferenceSuggestionRequest) returns (google.protobuf.Empty);

    // ─── SUPERWIZOR_ADMIN — cross-org session activity (2026-05-29) ──
    //
    // Read-only listing of recent therapist session activity for the
    // /admin/sessions page. Gated on x-superwizor-role=SUPERWIZOR_ADMIN
    // via the existing Connect auth interceptor; org_admin / therapist
    // tokens get PermissionDenied.
    //
    // Filters (all AND-combined): created_at window, free-text on
    // therapist name + email. CSV export is implemented client-side by
    // requesting page_size up to MaxCsvPageSize and serialising the
    // response.
    rpc TrackEvents(TrackEventsRequest) returns (TrackEventsResponse);
    rpc AdminListSessions(AdminListSessionsRequest) returns (AdminListSessionsResponse);
    rpc GetAdminAnalytics(GetAdminAnalyticsRequest) returns (GetAdminAnalyticsResponse);

    // ─── Admin Report Feedback Dashboard — SUPERWIZOR_ADMIN only ───
    // Paginated list of all report ratings with therapist info.
    // Powers the "Feedback" tab in the admin analytics page.
    rpc AdminListReportRatings(AdminListReportRatingsRequest) returns (AdminListReportRatingsResponse);
    // Toggles a rating's admin review status (pending ↔ done).
    rpc AdminSetRatingReviewStatus(AdminSetRatingReviewStatusRequest) returns (google.protobuf.Empty);

    // ─── Admin Prompt Studio (docs/31) — SUPERWIZOR_ADMIN only ───
    // Versioned editor for modalities.therapist_ai_general_prompt.
    // The live column is what llm-worker reads per report; every update
    // bumps it AND appends a snapshot to modality_prompt_versions in one
    // transaction. Restore = AdminUpdateModalityPrompt with historical
    // text (no separate rollback RPC).
    rpc AdminListModalityPrompts(google.protobuf.Empty) returns (AdminListModalityPromptsResponse);
    rpc AdminGetModalityPromptHistory(AdminGetModalityPromptHistoryRequest) returns (AdminGetModalityPromptHistoryResponse);
    rpc AdminUpdateModalityPrompt(AdminUpdateModalityPromptRequest) returns (AdminUpdateModalityPromptResponse);

    // ─── AI chat control surface (ADR 62 section 11) ───
    // Reads and flips the chat kill switch. The runbook (docs/64) also
    // documents a direct SQL path as break-glass; this RPC is the normal
    // route because it is the one that writes the audit event. A switch
    // flipped without a record of who flipped it and why is half a
    // safety mechanism.
    rpc AdminGetChatControls(AdminGetChatControlsRequest) returns (AdminChatControls);
    rpc AdminSetChatControls(AdminSetChatControlsRequest) returns (AdminChatControls);

    // ─── Org analytics (docs/38 §7) — ORG_ADMIN only ───
    // Per-therapist metadata aggregates for the caller's organization.
    // HARD privacy boundary (§7.3): counts and durations ONLY — never
    // transcripts, reports, notes, or patient identity. Org resolved
    // from the auth context, never from the request.
    rpc GetOrgTherapistMetrics(GetOrgTherapistMetricsRequest) returns (OrgTherapistMetricsResponse);
    // Org-scoped analytics widgets (docs/38 §7.2) — the /org Analityka
    // tab's charts: WAU, weekly session/duration trends, day×hour
    // heatmap, per-therapist token utilization, and the session counts
    // behind the "time saved on reporting" KPI. Same §7.3 privacy
    // boundary: aggregates only.
    rpc GetOrgAnalytics(GetOrgAnalyticsRequest) returns (GetOrgAnalyticsResponse);

    // ─── Client panel (docs/39) — role PATIENT, self-access ───
    // Separate read-only family gated by requireClientFileAccess
    // (caller is the kartoteka's patient). Default-deny: only rows the
    // therapist explicitly shared are visible (D2). No reports, no
    // therapist-private notes — ever.
    rpc ClientGetMyOverview(google.protobuf.Empty) returns (ClientOverview);
    rpc ClientListSessions(ClientListSessionsRequest) returns (ClientListSessionsResponse);
    rpc ClientGetTranscript(ClientGetTranscriptRequest) returns (ClientGetTranscriptResponse);
    rpc ClientListNotes(ClientListNotesRequest) returns (ClientListNotesResponse);
    rpc ClientCreateNote(ClientCreateNoteRequest) returns (ClientNote);
    rpc ClientSendNote(ClientSendNoteRequest) returns (ClientNote);
    rpc ClientMarkNoteRead(ClientMarkNoteReadRequest) returns (google.protobuf.Empty);
    // docs/39 PR13 — panel management.
    //   ClientDeleteNote: HARD-delete the client's OWN note (CLIENT_NOTE)
    //     everywhere, including from the therapist if it was already sent.
    //   ClientHideItem: dismiss a therapist-shared session/note from the
    //     client's panel only (client_hidden_at) — therapist keeps it.
    rpc ClientDeleteNote(ClientDeleteNoteRequest) returns (google.protobuf.Empty);
    rpc ClientHideItem(ClientHideItemRequest) returns (google.protobuf.Empty);

    // Therapist-side sharing toggles (docs/39 D2/D6) — gated by
    // requireTherapistDataAccess like every kartoteka mutation.
    rpc ShareSessionWithClient(ShareSessionWithClientRequest) returns (google.protobuf.Empty);
    rpc ShareNoteWithClient(ShareNoteWithClientRequest) returns (google.protobuf.Empty);

    // ─── RODO/GDPR DSAR endpoints ───
    // Export all clinical and personal data related to a patient file,
    // decrypting all PHI columns using KMS before returning.
    rpc ExportPatientData(ExportPatientDataRequest) returns (ExportPatientDataResponse);

    // Cascaded soft-delete of all patient data (patient file, sessions, notes).
    // The daily hard-delete purger will physically delete the records after 30 days.
    rpc DeletePatientData(DeletePatientDataRequest) returns (google.protobuf.Empty);

    // ─── Transcript segment editing and splitting ───
    rpc EditTranscriptSegment(EditTranscriptSegmentRequest) returns (EditTranscriptSegmentResponse);
    rpc SplitTranscriptSegment(SplitTranscriptSegmentRequest) returns (SplitTranscriptSegmentResponse);

    // ─── AI Assistant (Faza 1+2, docs/critical_analysis) ───
    // Generates a one-shot session briefing for a patient using RAG
    // context from rag_memories. Runs Gemini Flash server-side (no PHI
    // leaves the backend). Audit-logged to chat_interactions.
    rpc GenerateSessionBrief(GenerateSessionBriefRequest) returns (GenerateSessionBriefResponse);

    // Conversational AI with the guardrail layer (ADR
    // docs/kronikarz/62 sections 4-5). UNARY, not streaming: the
    // verifier inspects the complete model response before any of it
    // reaches the therapist, and a token already on the wire cannot be
    // withdrawn. Streaming is admissible only for A4_EDU (no client
    // context) and is not implemented.
    //
    // Every call runs: kill switch -> quota reservation -> classifier
    // -> router -> intent executor -> schema validation -> verifier.
    rpc AskPatientQuestion(AskPatientQuestionRequest) returns (AskPatientQuestionResponse);
}

enum ProcessType {
    PROCESS_TYPE_UNSPECIFIED = 0;
    PROCESS_TYPE_INDIVIDUAL = 1;
    PROCESS_TYPE_COUPLE = 2;
    PROCESS_TYPE_FAMILY = 3;
    PROCESS_TYPE_GROUP = 4;
}

message PatientFile {
    string id = 1;
    string therapist_id = 2;
    string patient_id = 3;
    // Modality is set at CreatePatientFile time and is intentionally
    // immutable afterwards — sessions/reports attached to this kartoteka
    // were analyzed under this modality's prompts and switching mid-process
    // would silently re-frame past clinical work. Flutter should gray out
    // the modality picker once the kartoteka exists. If a therapist picks
    // wrong, the path is DeletePatientFile + recreate.
    string modality_id = 4;
    string modality_code = 5; // resolved system_code from modalities table
    string working_alias = 6;
    ProcessType process_type = 7;
    string initial_complaint = 8;
    bool is_process_closed = 9;
    bool has_recording_consent = 10;
    google.protobuf.Timestamp consent_given_at = 11;
    google.protobuf.Timestamp first_consultation_at = 12;
    string private_therapist_notes = 13;
    google.protobuf.Timestamp created_at = 14;
    google.protobuf.Timestamp updated_at = 15;
    // DEPRECATED (docs/43 §4, migration 000077): the kartoteka's only
    // identifier is working_alias — these always come back empty.
    string patient_first_name    = 16 [deprecated = true];
    string patient_last_name     = 17 [deprecated = true];
    string patient_language_code = 18;
    // RESOLVED client e-mail (never stored on the kartoteka since
    // migration 000077): the activated account's users.email, else the
    // latest non-revoked invitation's address. Empty when none.
    // Drives the invite-sheet seed and the "send action plan" gate.
    string patient_email         = 19;
    // Therapist-managed lifecycle: "ACTIVE" | "COMPLETED" | "PAUSED".
    // Persisted in patient_files.lifecycle_status (migration 000058).
    // Replaces the Flutter-only SharedPreferences-backed lifecycle.
    // COMPLETED also sets is_process_closed=true for backward compat.
    string lifecycle_status       = 20;
    // Avatar customization JSON: {"label": "AK", "color": 3}.
    // Empty string when no customization (use auto-initials + default
    // color). Persisted in patient_files.avatar_config (migration 000059).
    string avatar_config          = 21;
}

message Modality {
    string id = 1;
    string system_code = 2;
    string display_name = 3;
    bool is_supported = 4;
    // "therapy" or "coaching". Drives downstream label semantics
    // (clinical vs coaching role vocabulary in transcripts). Added
    // in migration 000026 (2026-05-25). Empty string for any pre-
    // migration consumer that hasn't regenerated stubs.
    string modality_type = 5;
}

message CreatePatientFileRequest {
    string therapist_id = 1; // walidowany przeciw token JWT
    string modality_code = 2; // "CBT", "PSYCHO", "UNIV"
    string working_alias = 3;
    ProcessType process_type = 4;
    string initial_complaint = 5;
    bool has_recording_consent = 6;
    string idempotency_key = 7;
    // DEPRECATED (docs/43 §4): accepted for wire compat with older app
    // builds and IGNORED — the kartoteka identifies the client by
    // working_alias only and stores no e-mail (invite flow owns it).
    string patient_first_name    = 8 [deprecated = true];
    string patient_last_name     = 9 [deprecated = true];
    string patient_language_code = 10;
    string patient_email         = 11 [deprecated = true];
}

message GetPatientFileRequest {
    string patient_file_id = 1;
}

message ListPatientFilesRequest {
    string therapist_id = 1;
    int32 page_size = 2;
    string page_token = 3;
}

message ListPatientFilesResponse {
    repeated PatientFile patient_files = 1;
    string next_page_token = 2;
}

// UpdatePatientFileRequest — therapist-editable fields on a kartoteka.
// Deliberately excluded:
//   - modality_id / modality_code: immutable after create (see PatientFile.modality_id)
//   - therapist_id / patient_id: ownership is established at create time
//   - has_recording_consent / consent_given_at: separate consent flow
//   - process_type: structural decision, treated like modality
// Patient-user fields (first_name, last_name, language_code) live on
// UpdatePatientUserRequest — separate RPC.
message UpdatePatientFileRequest {
    string patient_file_id = 1;
    string working_alias = 2;
    string initial_complaint = 3;
    string private_therapist_notes = 4;
    bool is_process_closed = 5;
    // Lifecycle status: "ACTIVE" | "COMPLETED" | "PAUSED".
    // When set to "COMPLETED", also flips is_process_closed=true.
    // When set to "ACTIVE" or "PAUSED", flips is_process_closed=false.
    // Empty string means "leave unchanged".
    string lifecycle_status = 6;
}

message DeletePatientFileRequest {
    string patient_file_id = 1;
}

// UpdatePatientUser — mutates the paired users(role='PATIENT') row.
// Identified by patient_file_id so the handler can do the standard
// therapist-ownership authz on the parent kartoteka. Empty fields
// mean "leave alone" (server-side COALESCE/NULLIF).
message UpdatePatientUserRequest {
    string patient_file_id = 1;
    // DEPRECATED (docs/43 §4): accepted for wire compat and IGNORED —
    // client names/e-mail are no longer stored (alias is edited via
    // UpdatePatientFile; e-mail lives in the identity domain).
    string first_name      = 2 [deprecated = true];
    string last_name       = 3 [deprecated = true];
    string language_code   = 4;
    string patient_email   = 5 [deprecated = true];
}

// ── Patient notes + action plan (docs/22) ──────────────────────────────
message PatientNote {
    string id = 1;
    string patient_file_id = 2;
    string kind = 3;               // FREE_NOTE | ACTION_PLAN
    string source_session_id = 4;  // empty for FREE_NOTE
    string title = 5;              // decrypted server-side
    string text = 6;               // decrypted server-side
    google.protobuf.Timestamp sent_to_patient_at = 7; // null if never sent
    string sent_to_email = 8;
    google.protobuf.Timestamp created_at = 9;
    google.protobuf.Timestamp updated_at = 10;
    // docs/39 client panel. THERAPIST (default) or PATIENT (CLIENT_NOTE
    // written by the client — read-only for the therapist).
    string author_role = 11;
    // When the therapist shared this note with the client panel
    // (ShareNoteWithClient). Unset = not shared. Always unset for
    // CLIENT_NOTE (those are visible to the client by construction).
    google.protobuf.Timestamp shared_with_client_at = 12;
    // When the client opened a shared therapist note. Unset = unread.
    google.protobuf.Timestamp read_by_client_at = 13;
    // When the therapist first listed this CLIENT_NOTE. ListPatientNotes
    // returns the pre-mark state, so a fresh client note arrives with
    // this unset exactly once — the UI renders its "new" badge off that
    // edge. Unset for therapist-authored notes too (never marked).
    google.protobuf.Timestamp read_by_therapist_at = 14;
}

message CreatePatientNoteRequest {
    string patient_file_id = 1;
    string title = 2;
    string text = 3;
    string kind = 4;               // defaults to FREE_NOTE if empty
    string source_session_id = 5;  // optional
}

message ListPatientNotesRequest { string patient_file_id = 1; }
message ListPatientNotesResponse { repeated PatientNote notes = 1; }

message UpdatePatientNoteRequest {
    string note_id = 1;
    string title = 2;
    string text = 3;
}

message DeletePatientNoteRequest { string note_id = 1; }

// GetActionPlanDraft — extracts the action-plan section from a session's
// report (server-side heuristic) to prefill the note editor, plus the
// patient e-mail availability for the send gate.
message GetActionPlanDraftRequest { string session_id = 1; }
message ActionPlanDraft {
    string suggested_title = 1;
    string suggested_text = 2;
    bool   patient_has_email = 3;
    string patient_email_masked = 4; // e.g. "p***@example.com"
}

// SavePatientNote — create/update a note and optionally e-mail it to the
// patient. send_to_patient=true with no patient e-mail → FAILED_PRECONDITION
// "PATIENT_EMAIL_MISSING" (note is still saved).
message SavePatientNoteRequest {
    string patient_file_id = 1;
    string note_id = 2;            // empty = create
    string title = 3;
    string text = 4;
    string kind = 5;               // FREE_NOTE | ACTION_PLAN
    string source_session_id = 6;  // optional
    bool   send_to_patient = 7;
}
message SavePatientNoteResponse {
    PatientNote note = 1;
    bool sent = 2;                 // true if the e-mail was sent
    // When send_to_patient was set but delivery failed, the note is
    // STILL saved (note above is populated) and this carries a stable
    // reason code so the UI can show "saved, but not sent" instead of a
    // false "save failed". Empty when sent==true or no send was requested.
    //   PATIENT_EMAIL_MISSING — no patient e-mail on file
    //   EMAIL_NOT_CONFIGURED  — notification-svc not wired (local dev)
    //   EMAIL_SEND_FAILED     — notification-svc/Resend rejected the send
    string send_error = 3;
}

// DeletePatientUser — RODO-style erasure of a patient. The user row
// is hard-deleted; every patient_file that references it cascades
// (migration 000014 flipped the FK to ON DELETE CASCADE), taking
// sessions / transcripts / reports / audio_uploads with them. The
// handler pre-fetches session IDs and publishes session.deleted
// Pub/Sub events so notification-svc can wipe Firestore mirrors +
// inbox notifications.
//
// Identified by patient_file_id rather than patient_id so the handler
// can do the existing therapist-ownership authz on the parent
// kartoteka. patient_user rows have no auth metadata of their own.
message DeletePatientUserRequest {
    string patient_file_id = 1;
}

message ListModalitiesResponse {
    repeated Modality modalities = 1;
}

message HealthCheckResponse {
    string status = 1;
    string version = 2;
}

message UpdateSpeakerLabelsRequest {
  string session_id = 1;
  // Mapping: speaker_tag (jako string "1", "2", "3") → nowy label
  // Przykład: {"1": "Anna Kowalska", "2": "Marek Kowalski"}
  map<string, string> label_mapping = 2;
}

message UpdateSpeakerLabelsResponse {
  string session_id = 1;
  string transcript_id = 2;
  int32 segments_updated = 3;
  bool blob_rebuilt = 4;
}

message Session {
  string id = 1;
  string therapist_id = 2;
  string patient_file_id = 3;
  string audio_upload_id = 4;
  string session_date = 5;
  int32 session_number = 6;
  int32 duration_seconds = 7;
  string contact_form = 8;
  map<string, string> speaker_label_mapping = 9;
  string status = 10;
  google.protobuf.Timestamp created_at = 11;
  // Free-text label shown in the kartoteka list. Default at create-time:
  // "<modality display_name> <session_number>". Therapist can rename via
  // ClinicalService.UpdateSession. Migration 000011 added the column;
  // ingestion-svc.CompleteAudioUpload populates it on new sessions.
  string name = 12;
  // Timestamp when the therapist first opened the report for this
  // session. Zero/empty when unviewed — Flutter shows "nowy raport"
  // badge. Set via MarkReportViewed RPC. Migration 000059.
  google.protobuf.Timestamp report_viewed_at = 13;
  int64 file_size_bytes = 14;
  // docs/39: when the therapist shared this session with the client
  // panel (ShareSessionWithClient). Unset = not shared.
  google.protobuf.Timestamp shared_with_client_at = 15;
}

message ListSessionsRequest {
  string patient_file_id = 1;
}

// UpdateSession — rename a session. Currently `name` is the only
// mutable field; add more here as edit needs surface (e.g. session_date
// correction). Empty `name` is rejected by the handler.
message UpdateSessionRequest {
  string session_id = 1;
  string name = 2;
}

// DeleteSession — hard delete via CASCADE (migration 000012).
// Removes transcripts, reports, hitop_measurements, audio_uploads
// rows referencing this session. Publishes session.deleted Pub/Sub
// event so notification-svc can purge the Firestore mirror + inbox.
message DeleteSessionRequest {
  string session_id = 1;
}

message CancelSessionRequest {
  string session_id = 1;
}

// MarkReportViewed — sets report_viewed_at on a COMPLETED session.
// Idempotent (COALESCE preserves first-view timestamp).
message MarkReportViewedRequest {
  string session_id = 1;
}

// SetAvatarConfig — sets or clears avatar customization on a patient file.
message SetAvatarConfigRequest {
  string patient_file_id = 1;
  // JSON string: {"label": "AK", "color": 3}. Empty = clear.
  string avatar_config = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message TranscriptSegment {
  int32 speaker_tag = 1;
  string speaker_label = 2;
  int32 start_offset_ms = 3;
  int32 end_offset_ms = 4;
  string text = 5;
  float confidence = 6;
}

message Transcript {
  string id = 1;
  // Per-chunk segments — one row per pause-bounded utterance from STT.
  // Kept for the speaker-label edit UI (UpdateSpeakerLabels) and any
  // analysis that needs raw granularity. The read-only transcript view
  // should bind to `turns` instead, which collapses consecutive
  // same-speaker chunks into one block.
  repeated TranscriptSegment segments = 2;
  // Speaker-grouped view derived from `segments`. Computed server-side
  // (clinical-svc.GroupSegmentsIntoTurns) so every client renders the
  // same shape: one entry per uninterrupted stretch of a single speaker.
  // Joining/timestamping is policy that lives backend-side; clients
  // only choose the timestamp display format from start_offset_ms.
  repeated SpeakerTurn turns = 3;
}

// SpeakerTurn — a contiguous span of segments attributed to one
// speaker. Display contract:
//   "[<speaker_label> · <start_offset_ms formatted>] <text>"
// `segment_count` exists so a future "expand to raw chunks" UI can
// jump back to the underlying TranscriptSegments without an extra
// fetch. `confidence_avg` is the word-count-weighted mean across the
// underlying segments — fall back to plain mean if word counts are
// zero (defensive; STT always emits them today).
message SpeakerTurn {
  int32 speaker_tag      = 1;
  string speaker_label   = 2;
  int32 start_offset_ms  = 3;
  int32 end_offset_ms    = 4;
  string text            = 5;
  int32 segment_count    = 6;
  float confidence_avg   = 7;
}

message Report {
  string id = 1;
  string title = 2;
  string summary_short = 3;
  string content = 4;
  string sentiment_label = 5;
  string risk_level = 6;
}

message GetSessionDetailsRequest {
  string session_id = 1;
}

message GetSessionDetailsResponse {
  Session session = 1;
  Transcript transcript = 2;
  repeated Report reports = 3;
}

// ─── Report ratings (docs/10_REPORT_CUSTOMIZATION.md §5) ───

message ReportRating {
  string id = 1;
  string report_id = 2;
  string therapist_id = 3;
  // "positive" | "negative"
  string rating = 4;
  // Chip categories the therapist picked on the negative-rating
  // modal. Empty when rating="positive". See design doc for
  // canonical list.
  repeated string issues = 5;
  // Optional free-form note ≤200 chars, server-sanitized.
  string notes = 6;
  // Origin of the rating: "in_app" | "email" | "post_session" | ...
  string source = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message RateReportRequest {
  string report_id = 1;
  // Therapist doing the rating. Server validates against the
  // authenticated user — request therapist_id must equal session
  // therapist_id.
  string therapist_id = 2;
  // "positive" | "negative". Rejects other values.
  string rating = 3;
  repeated string issues = 4;
  string notes = 5;
  string source = 6;
  // Required. UPSERT key: same (report, therapist) with same
  // idempotency_key replays as no-op. Different idempotency_key on
  // the same (report, therapist) overwrites the prior rating
  // (re-rating is intended behavior).
  string idempotency_key = 7;
}

message RateReportResponse {
  ReportRating rating = 1;
}

message GetReportRatingRequest {
  string report_id = 1;
  string therapist_id = 2;
}

message GetActiveSuggestionRequest {
  string therapist_id = 1;
}

message PreferenceSuggestion {
  // Empty string = no active suggestion (Flutter hides banner).
  // Non-empty = stable ID for telemetry round-trips. All
  // alternatives below share this same id — the user sees ONE
  // banner; suggestion_id identifies that banner session, not the
  // specific dimension.
  string suggestion_id = 1;
  // Which preference dimension to nudge (matches a field name on
  // identity.v1.ReportPreferences). This is the top candidate —
  // dimension/from_value/to_value/reason_label/trigger_count
  // duplicate alternatives[0] (or are empty if no candidate
  // survives filtering).
  string dimension = 2;
  string from_value = 3;
  string to_value = 4;
  // Localized chip label that triggered this suggestion (e.g.
  // "za długi"). UI uses it to render the banner copy.
  string reason_label = 5;
  // How many negatives drove this (≥3 by current trigger).
  int32 trigger_count = 6;
  // Ranked candidate list (highest chip count first). The first
  // entry is identical to the top-level fields above; subsequent
  // entries are fall-backs the client can iterate when the top
  // candidate is a no-op (current pref already equals to_value).
  // Empty when no candidates survive trigger-count + dimension +
  // cooldown filtering. Always populated for non-empty
  // suggestion_id responses (alternatives.length >= 1).
  repeated PreferenceSuggestionCandidate alternatives = 7;
}

// PreferenceSuggestionCandidate is one row in the ranked candidate
// list. Same shape as the top-level PreferenceSuggestion fields
// minus suggestion_id (shared at the top level).
message PreferenceSuggestionCandidate {
  string dimension = 1;
  string from_value = 2;
  string to_value = 3;
  string reason_label = 4;
  int32 trigger_count = 5;
}

message LogPreferenceSuggestionRequest {
  string therapist_id = 1;
  // Echoed back from PreferenceSuggestion.suggestion_id that
  // identity-svc handed to the Flutter client.
  string suggestion_id = 2;
  // Which dimension the banner targeted.
  string dimension = 3;
  string from_value = 4;
  string to_value = 5;
  int32 trigger_count = 6;
  // Lifecycle event: "shown" | "applied" | "dismissed".
  // "applied" fires from UpdateReportPreferences in identity-svc
  // (we log to both rows so analytics doesn't need a cross-service
  // join); "shown"/"dismissed" come from the Flutter UI directly.
  string action = 7;
}

// ─── AdminListSessions — recent therapist session activity ─────────
//
// Backs the /admin/sessions page on superwizor.web.app. SUPERWIZOR_ADMIN
// only.

message AdminListSessionsRequest {
  // Window on sessions.created_at. Both bounds are inclusive on the
  // low end / exclusive on the high end (PG idiomatic). If unset, the
  // server uses [now()-24h, now()] so the default UI shows the last
  // 24h.
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;

  // Case-insensitive substring filter on therapist first_name +
  // last_name + email. Empty = no filter.
  string therapist_filter = 3;

  // Page size. Server clamps to [1, 5000]. Default 100 if zero. 5000
  // is the CSV-export cap; UI uses a smaller value (50) for paged
  // browsing.
  int32 page_size = 4;

  // Zero-based offset. Server reads page+1 row to compute has_more.
  int32 page = 5;

  // Sort key — one of the allowlisted columns below. Anything else
  // (including empty) falls back to created_at.
  //
  //   "created_at"           — when the upload landed (default)
  //   "session_date"         — the clinical session date
  //   "duration_seconds"
  //   "status"
  //   "therapist"            — last_name, then first_name
  //   "organization"         — legal_name
  //   "plan_name"            — subscription_plans.display_name
  //   "period_end"           — subscriptions.current_period_end
  //   "tokens_used"          — usage_counters.tokens_used
  //
  // Anything else falls through to the default. The server doesn't
  // 400 on unknown sort keys — the UI will just behave as if the
  // sort wasn't set.
  string sort_by = 6;

  // "asc" | "desc". Anything else defaults to "desc".
  string sort_order = 7;

  // Optional filter to a single organization (organizations.id). Empty =
  // all organizations. Matched against the therapist's organization_id.
  string organization_id = 8;

  // Case-insensitive substring filter on the organization's legal_name.
  // Empty = no filter. The admin UI uses this as a free-text search box
  // (same UX as therapist_filter).
  string organization_search = 9;
}

message AdminListSessionsResponse {
  repeated AdminSessionRow sessions = 1;
  // True when the server has additional rows past this page.
  bool has_more = 2;
}

message AdminSessionRow {
  string session_id = 1;
  string therapist_id = 2;
  string therapist_first_name = 3;
  string therapist_last_name = 4;
  string therapist_email = 5;
  string organization_id = 6;
  string organization_name = 7;
  // When the session row was created server-side (effectively when
  // the therapist hit Save in the UI / when the audio upload landed).
  google.protobuf.Timestamp created_at = 8;
  // The clinical session date — a DATE column, transmitted as a
  // timestamp at 00:00 UTC for simplicity.
  google.protobuf.Timestamp session_date = 9;
  // null for sessions that haven't completed STT yet.
  int32 duration_seconds = 10;
  // session_status enum value as a bare string ("CREATED",
  // "TRANSCRIBING", "DONE", "FAILED", …).
  string status = 11;
  // Subscription context for the therapist's organisation at query
  // time. All three fields are best-effort — null/empty for org-less
  // therapists, suspended subscriptions, or counters that haven't
  // been initialised yet. The handler always picks the most-recent
  // active row (a single org has at most one ACTIVE subscription at
  // a time per ADR-BL-001).
  string subscription_plan_name = 12;
  google.protobuf.Timestamp subscription_period_end = 13;
  int32 subscription_tokens_used = 14;
}

