syntax = "proto3";

package notification.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/superwizor-ai/backend/gen/go/notification/v1;notificationv1";

// NotificationService is the Flutter-facing API for FCM token lifecycle and
// inbox queries. The actual notification *delivery* happens out-of-band in the
// Cloud Functions Gen2 worker (`cmd/worker/`) which subscribes to Pub/Sub.
//
// Inbox listing is NOT a gRPC call — Flutter subscribes directly to Firestore
// `user_notifications/{uid}/inbox/` for live updates with offline cache.
// Backend (this service) is the only writer of those Firestore docs.
service NotificationService {
  // FCM device token lifecycle.
  rpc RegisterFCMToken(RegisterFCMTokenRequest) returns (RegisterFCMTokenResponse);
  rpc RemoveFCMToken(RemoveFCMTokenRequest) returns (google.protobuf.Empty);

  // Inbox count (badge support). Detail listing is Firestore-direct from Flutter.
  rpc GetUnreadCount(google.protobuf.Empty) returns (GetUnreadCountResponse);

  // Web-app: send a transactional email (invitation magic-link).
  // Internal RPC — callers are other backend services (identity-svc
  // fires this from InviteTherapist), never the Flutter client.
  // Locale picks the right body under
  // services/notification-svc/internal/i18n/templates/{locale}/invitation.md.
  rpc SendInvitationEmail(SendInvitationEmailRequest) returns (google.protobuf.Empty);

  // Web-app: confirm-your-email link after self-serve registration.
  // identity-svc generates the verify_url (Firebase Auth verification
  // link, retrieved via Firebase Admin SDK) and delegates the email
  // copy + delivery to notification-svc so the localized branding +
  // template lives in one place.
  rpc SendEmailVerification(SendEmailVerificationRequest) returns (google.protobuf.Empty);

  // Web-app: 80% / 95% quota warning email. Fired by billing-svc when
  // a CommitUsage crosses one of the thresholds for the first time
  // in the current billing period. Idempotency lives in billing-svc
  // (the threshold-crossing flag is per-period); this RPC always
  // sends regardless.
  rpc SendQuotaWarning(SendQuotaWarningRequest) returns (google.protobuf.Empty);

  // Send a session's "action plan" to the patient by e-mail (docs/22).
  // Internal RPC — clinical-svc fires this from SavePatientNote when the
  // therapist chooses "save and send". Template is loaded from the
  // email_templates table (key 'action_plan'), falling back to the
  // embedded default.
  rpc SendActionPlanEmail(SendActionPlanEmailRequest) returns (SendActionPlanEmailResponse);

  rpc HealthCheck(google.protobuf.Empty) returns (HealthCheckResponse);
}

message SendActionPlanEmailRequest {
  string to_email                = 1;  // patient e-mail (validated by caller)
  string therapist_display_name  = 2;
  string action_plan_text        = 3;  // plain text; newlines → <br> for HTML
  string session_date            = 4;  // pre-formatted display date
  string locale                  = 5;  // 'pl' | 'en'; falls back to 'pl'
  string idempotency_key         = 6;  // e.g. "<note_id>:action_plan_sent"
}

message SendActionPlanEmailResponse {
  string delivery_id = 1;
}

message SendInvitationEmailRequest {
  string recipient_email     = 1;  // recipient (lowercased)
  string organization_name   = 2;  // for the "you've been invited to X" line
  string inviter_first_name  = 3;  // who sent the invite
  string accept_url          = 4;  // full URL incl. token
  string expires_at_iso      = 5;  // ISO-8601 expiry timestamp; renderer formats
  string locale              = 6;  // 'pl' | 'en'; falls back to 'pl' if unknown
}

message SendEmailVerificationRequest {
  string recipient_email = 1;  // recipient (lowercased)
  string first_name      = 2;  // for the greeting
  string verify_url      = 3;  // Firebase Auth verification link
  string expires_at_iso  = 4;  // ISO-8601; mirrors invitation's contract
  string locale          = 5;  // 'pl' | 'en'; falls back to 'pl' if unknown
}

message SendQuotaWarningRequest {
  string recipient_email   = 1;  // ORG_ADMIN's email
  string first_name        = 2;
  string organization_name = 3;
  int32  usage_percent     = 4;  // 80 or 95 today; renderer formats as "80%"
  int32  tokens_remaining  = 5;  // tokens left before the period rolls
  string plan_tier         = 6;  // "TRIAL" | "SOLO" | "PRO" | "CLINIC"
  string plan_cycle        = 7;  // "MONTHLY" | "ANNUAL"
  string period_end_iso    = 8;  // ISO-8601 end of current period
  string billing_url       = 9;  // deep link to the billing panel
  string locale            = 10; // 'pl' | 'en'; falls back to 'pl' if unknown
}

// RegisterFCMToken upserts an FCM token for the authenticated user.
//
// user_id is resolved from the Firebase ID token in gRPC metadata server-side;
// it is NEVER trusted from the client.
//
// Idempotent: re-registering an active (user_id, token) pair updates
// last_used_at + app_version + device_model + locale and returns
// already_registered=true. Token rotation handled by Firebase SDK on the
// client; on rotation the client calls this with the new token.
message RegisterFCMTokenRequest {
  string token = 1;           // opaque FCM identifier (not PHI per ADR-IMPL-013)
  Platform platform = 2;
  string app_version = 3;     // semver string; informational
  string device_model = 4;    // for support diagnostics
  string locale = 5;          // BCP-47, e.g. "pl-PL"
}

message RegisterFCMTokenResponse {
  string token_id = 1;        // UUID of the fcm_tokens row
  bool already_registered = 2; // true if same (user, token) was already active
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_IOS = 1;
  PLATFORM_ANDROID = 2;
  PLATFORM_WEB = 3;
}

// RemoveFCMToken soft-deletes a token (sets invalidated_at). Called on user
// logout from a device. Idempotent: removing an already-removed token is a
// no-op success.
message RemoveFCMTokenRequest {
  string token = 1;
}

message GetUnreadCountResponse {
  int32 count = 1;
}

message HealthCheckResponse {
  bool ok = 1;
  string version = 2;
}
