syntax = "proto3";

package billing.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/superwizor-ai/backend/gen/go/billing/v1;billingv1";

// BillingService — quota i lifecycle subskrypcji (Phase 3).
//
// Model tokenów (ADR-DM-017): 1 token = ≤75min audio (twarda granica, bez grace).
// Pula trzymana per organizacja, debet idzie dwuetapowo:
// ReserveCredit (przy CreateAudioUpload) → CommitUsage (po STT, znany duration).
//
// Reference: docs/16_BILLING_SERVICE_PHASE_3.md
service BillingService {
  // Sprawdza dostępną pulę tokenów (read-only, nie blokuje).
  rpc CheckQuota(CheckQuotaRequest) returns (QuotaDecision);

  // Rezerwuje token na sesję (ADR-BL-001). TTL 4h.
  // Idempotent po session_id: powtórne wywołanie zwraca tę samą rezerwację.
  rpc ReserveCredit(ReserveCreditRequest) returns (Reservation);

  // Commituje token po STT, ze znanym duration_seconds.
  // Idempotent po session_id (usage_events.session_id UNIQUE).
  rpc CommitUsage(CommitUsageRequest) returns (UsageCommit);

  // Zwalnia rezerwację (np. upload failed, manual cancel przed STT).
  // Idempotent: re-call na RELEASED/COMMITTED zwraca OK bez zmian.
  rpc ReleaseCredit(ReleaseCreditRequest) returns (google.protobuf.Empty);

  // DEPRECATED: użyj CommitUsage. Zachowane dla Phase 2 callers.
  // Internal mapping: amount → tokens (1:1), duration_seconds = 0,
  // co oznacza że advisory lock + counter update działają jak commit
  // ale bez weryfikacji formuły grace period.
  rpc IncrementUsage(IncrementUsageRequest) returns (google.protobuf.Empty) {
    option deprecated = true;
  }

  // Stan subskrypcji + bieżące zużycie.
  rpc GetSubscription(GetSubscriptionRequest) returns (Subscription);

  // Pobiera historię faktur dla organizacji.
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);

  // ─── Web app: SUPERWIZOR_ADMIN actions (docs/18 §6.1, §13.7) ──
  // Both RPCs are role-gated at the handler level (caller must
  // have role=SUPERWIZOR_ADMIN). Both write audit_events with
  // reason (>=10 chars enforced at the handler) and actor_type=
  // SUPERWIZOR_ADMIN. Idempotency-key cache de-dupes retries.

  // Sets usage_counters.tokens_used (and optionally tokens_limit)
  // on the org's current active counter. Used for support escapes
  // — refunds, manual top-ups, period rolls. Returns the fresh
  // Subscription proto so the admin UI updates inline.
  rpc AdminResetTokens(AdminResetTokensRequest) returns (Subscription);

  // Changes the org's subscription plan_tier + plan_cycle. Creates
  // a new usage_counters row at the new plan's tokens_limit, marks
  // the old counter inactive. Returns the fresh Subscription.
  rpc AdminChangePlan(AdminChangePlanRequest) returns (Subscription);

  // ─── Org management (docs/38) ─────────────────────────────────

  // SUPERWIZOR_ADMIN. Sets/updates the org's seat allocations
  // (plan × seats × negotiated price) and ensures a MANUAL
  // subscription exists starting at subscription_start. Creates
  // per-therapist usage counters for already-seated therapists;
  // later joiners get theirs lazily on first ReserveCredit.
  // reason >= 10 chars → audit_events.
  rpc AdminSetSeatAllocations(AdminSetSeatAllocationsRequest) returns (OrgSeatSummary);

  // ORG_ADMIN. Seat occupancy + per-therapist token usage for the
  // /org panel. Org resolved from the caller's auth context.
  rpc GetMyOrgSeatUsage(google.protobuf.Empty) returns (OrgSeatSummary);

  // SUPERWIZOR_ADMIN. Active plan catalog — feeds the /admin/orgs/new
  // seat-allocation table (plan_id × seats × price).
  rpc AdminListPlans(google.protobuf.Empty) returns (AdminListPlansResponse);

  // SUPERWIZOR_ADMIN. Seat occupancy + per-therapist usage for ANY
  // organization — the /admin/orgs/[id] edit surface. Same payload as
  // GetMyOrgSeatUsage but org comes from the request, gated on the
  // platform-admin role.
  rpc AdminGetOrgSeatUsage(AdminGetOrgSeatUsageRequest) returns (OrgSeatSummary);

  // ─── Kody rabatowe (docs/70 §6) ───────────────────────────────

  // SUPERWIZOR_ADMIN. Zakłada kod rabatowy: nasz wiersz w
  // discount_codes + coupon i promotion code po stronie Stripe'a
  // (to Stripe atomowo pilnuje max_redemptions przy checkoucie).
  // reason >= 10 znaków → audit_events.
  rpc AdminCreateDiscountCode(AdminCreateDiscountCodeRequest) returns (DiscountCode);

  // SUPERWIZOR_ADMIN. Zmienia nazwę / termin / limit / aktywność.
  // Stripe nie pozwala zmienić expires_at ani max_redemptions na
  // istniejącym promotion code, więc zmiana któregokolwiek z nich
  // zakłada NOWY promotion code pod tym samym kuponem i wygasza stary
  // (docs/70 §6.4 D10).
  rpc AdminUpdateDiscountCode(AdminUpdateDiscountCodeRequest) returns (DiscountCode);

  // SUPERWIZOR_ADMIN. Lista kodów do tabeli w panelu.
  rpc AdminListDiscountCodes(AdminListDiscountCodesRequest) returns (AdminListDiscountCodesResponse);

  // SUPERWIZOR_ADMIN. Kod + historia użyć (organizacja, data, kanał).
  rpc AdminGetDiscountCode(AdminGetDiscountCodeRequest) returns (DiscountCodeDetails);

  // Zalogowany użytkownik. Walidacja kodu PRZED checkoutem: czy ważny,
  // czy obejmuje wybrany plan, ile wyniesie cena. Nie rezerwuje użycia —
  // rezerwacja powstaje przy tworzeniu sesji Checkout.
  rpc ValidateDiscountCode(ValidateDiscountCodeRequest) returns (DiscountCodeQuote);

  // ─── Zakupy w aplikacji: App Store / Google Play (docs/70 §7.2) ─

  // Zalogowany użytkownik. Co wolno pokazać na paywallu: aktywny
  // dostawca, czy zakup jest w ogóle dozwolony (i dlaczego nie),
  // katalog produktów sklepowych, tryb wzmianki o WWW. Aplikacja NIE
  // decyduje o tym sama — flagi i blokady krzyżowe żyją na serwerze.
  rpc GetBillingSurface(google.protobuf.Empty) returns (BillingSurface);

  // Zalogowany użytkownik. Bramka przed otwarciem arkusza zakupu:
  // sprawdza blokady (inny dostawca, organizacja na miejscach, flaga
  // wyłączona, równoległy checkout) i zwraca app_account_token, którym
  // aplikacja podpisuje transakcję w sklepie.
  rpc BeginStorePurchase(BeginStorePurchaseRequest) returns (BeginStorePurchaseResponse);

  // Zalogowany użytkownik. Weryfikuje zakup u Apple/Google i nadaje
  // uprawnienie. Aplikacja NIGDY nie przyznaje go sobie sama; transakcji
  // nie wolno finishować/acknowledge'ować przed sukcesem tego RPC.
  rpc VerifyStorePurchase(VerifyStorePurchaseRequest) returns (Subscription);

  // Zalogowany użytkownik. „Przywróć zakupy" (wymóg Apple 3.1.2).
  // Odrzuca transakcje z app_account_token innej organizacji.
  rpc RestoreStorePurchases(RestoreStorePurchasesRequest) returns (Subscription);

  // SUPERWIZOR_ADMIN. Dziennik transakcji sklepowych organizacji.
  rpc AdminListStoreTransactions(AdminListStoreTransactionsRequest) returns (AdminListStoreTransactionsResponse);
}

message CheckQuotaRequest {
  string organization_id = 1;
  string therapist_id    = 2;
  string usage_type      = 3;  // 'session_analysis'
  int32  amount          = 4;  // estymowane tokeny; default 1
}

message QuotaDecision {
  bool   allowed         = 1;
  string reason          = 2;  // 'OK', 'QUOTA_EXHAUSTED', 'SUBSCRIPTION_INACTIVE', ...
  // remaining/limit zostają (legacy) — od Phase 3 znaczą TOKENY, nie sesje.
  int32  remaining       = 3;
  int32  limit           = 4;
  // Explicit aliasy dla nowych callerów (= remaining/limit).
  int32  remaining_tokens = 5;
  int32  limit_tokens     = 6;
  google.protobuf.Timestamp period_end = 7;
}

message ReserveCreditRequest {
  string session_id       = 1;  // UUID; key idempotencji
  string organization_id  = 2;
  string therapist_id     = 3;
  int32  estimated_tokens = 4;  // optional; default 1
  string idempotency_key  = 5;
}

message Reservation {
  string reservation_id  = 1;
  string session_id      = 2;
  int32  tokens_reserved = 3;
  google.protobuf.Timestamp expires_at = 4;
  // Full counter snapshot AFTER this reservation was applied. Lets the
  // client refresh its cached billing state from a single round trip
  // instead of subscribing to a separate Firestore mirror. The field is
  // populated for newly-created reservations AND for the idempotent
  // "already exists" path — clients should always overwrite their
  // local cache with this value.
  Subscription state_after = 5;
}

message CommitUsageRequest {
  string session_id       = 1;  // UUID; key idempotencji
  string organization_id  = 2;
  string therapist_id     = 3;
  int32  duration_seconds = 4;  // autoritative, post-STT
  string usage_type       = 5;
  string idempotency_key  = 6;
}

message UsageCommit {
  int32  tokens_consumed  = 1;
  int32  remaining_tokens = 2;
  int32  limit_tokens     = 3;
  // Full counter snapshot AFTER this commit. Same role as on
  // Reservation — primary mechanism for clients to keep their local
  // billing cache in sync without a separate mirror.
  Subscription state_after = 4;
}

message ReleaseCreditRequest {
  string session_id      = 1;
  string organization_id = 2;
  string reason          = 3;  // 'UPLOAD_FAILED', 'USER_CANCELED', 'STT_FAILED'
}

message IncrementUsageRequest {
  option deprecated = true;
  string organization_id = 1;
  string therapist_id    = 2;
  string usage_type      = 3;
  int32  amount          = 4;
  string session_id      = 5;
  string idempotency_key = 6;
}

message GetSubscriptionRequest {
  string organization_id = 1;

  // Whose quota to report. Optional and additive: omit it (every
  // existing server-to-server caller does) and the response carries the
  // organization-wide numbers exactly as before.
  //
  // Set by clinical-svc on GetMyBillingState. Under the docs/38 seat
  // model a therapist in an org spends against a PER-THERAPIST counter,
  // but the app was reading the org-level one — so the phone showed the
  // org's limit (40/0) while the org panel showed the therapist's real
  // seat (30/1). Same period, two different counter rows.
  string therapist_id = 2;
}

message Subscription {
  string id                          = 1;
  string plan_tier                   = 2;
  string status                      = 3;
  // Legacy fields — populated z tokens_* dla wstecznej kompatybilności
  // (sesje ≈ tokens przy mapowaniu 1:1).
  int32  sessions_per_month_limit    = 4;
  int32  sessions_used_this_period   = 5;
  // Phase 3 canonical fields:
  int32  tokens_per_period           = 6;
  int32  tokens_used_this_period     = 7;
  int32  tokens_reserved_this_period = 8;
  google.protobuf.Timestamp current_period_start = 9;
  google.protobuf.Timestamp current_period_end   = 10;
  // Phase 3b (client-cache refactor): make Subscription a self-contained
  // snapshot suitable for direct caching on the client. Adds plan_cycle
  // (so SubscriptionPlanScreen can label MONTHLY vs ANNUAL without a
  // second lookup) and the server-computed tokens_remaining so callers
  // never have to reimplement the formula (max(0, limit - used - reserved)).
  string plan_cycle                  = 11;  // MONTHLY | ANNUAL
  int32  tokens_remaining            = 12;  // = max(0, limit - used - reserved)
  bool   cancel_at_period_end        = 13;
  google.protobuf.Timestamp canceled_at = 14;
  // docs/70: kto sprzedał tę subskrypcję — STRIPE | APPLE_IAP |
  // GOOGLE_IAP | MANUAL | P24. Decyduje, co pokazać na ekranie
  // Subskrypcja: link do portalu Stripe, deep link do sklepu, czy
  // komunikat "planem zarządza Twoja organizacja". Puste dla starych
  // klientów, którzy nie znają tego pola.
  string billing_provider            = 15;
  // Koniec billing grace period ze sklepu (nieudane obciążenie, dostęp
  // trwa). Puste poza tym stanem.
  google.protobuf.Timestamp grace_until = 16;
}


// ──────────────────────────────────────────────────────────────────
// Web admin messages — docs/18 §13.7 (Superwizor admin org form).
// ──────────────────────────────────────────────────────────────────

message AdminResetTokensRequest {
  string organization_id = 1;
  // New value for usage_counters.tokens_used. Must be >= 0.
  // Pass -1 to leave tokens_used unchanged (limit-only updates).
  int32 tokens_used = 2;
  // Optional override on tokens_limit. Pass -1 to leave it untouched
  // (only adjust tokens_used). When set, must be > 0.
  int32 tokens_limit = 3;
  // Required, >= 10 chars. Stored on audit_events.reason.
  string reason = 4;
  string idempotency_key = 5;
  // Optional scope narrowing. Empty (default) keeps the historical
  // behaviour: tokens_used lands on EVERY active per-therapist counter
  // of the organization plus the org-level one.
  //
  // When set, the reset touches ONLY that therapist's counter. The
  // admin panel's user card sends it — without this field the card
  // reset the whole organization while its audit reason named a single
  // person, so the trail claimed less than the operation did.
  //
  // tokens_limit is rejected in this mode: per-seat limits come from
  // the seat's plan (org_seat_allocations), not from an operator
  // override. Allowing one here would recreate the 2026-08-01 "40 on a
  // 90 plan" incident at seat level.
  string therapist_id = 6;
}

// ─── Org management messages (docs/38) ────────────────────────────

message PlanInfo {
  string plan_id      = 1;
  string tier         = 2;
  string cycle        = 3;
  string display_name = 4;
  string price_gross  = 5;  // catalog gross price, decimal string
  string currency_code = 6;
  int32  tokens_per_period = 7;
}

message AdminListPlansResponse {
  repeated PlanInfo plans = 1;
}

message AdminGetOrgSeatUsageRequest {
  string organization_id = 1;
}

message SeatAllocationSpec {
  string plan_id = 1;
  int32  seats   = 2;
  // Negotiated gross price per seat as a decimal string ("79.99").
  // Empty = catalog plan.price_gross.
  string price_gross_per_seat = 3;
}

message AdminSetSeatAllocationsRequest {
  string organization_id = 1;
  repeated SeatAllocationSpec allocations = 2;
  // Start of the (first) subscription period. Ignored when the org
  // already has an active subscription — the running period wins.
  google.protobuf.Timestamp subscription_start = 3;
  string reason = 15;           // required, >= 10 chars
  string idempotency_key = 16;
}

message SeatAllocationInfo {
  string allocation_id = 1;
  string plan_id       = 2;
  string plan_tier     = 3;
  string plan_cycle    = 4;
  int32  seats         = 5;
  // Occupancy halves (docs/38 §3): active assignments + pending
  // unexpired invitations.
  int32  seats_assigned = 6;
  int32  seats_pending  = 7;
  string price_gross_per_seat = 8;   // effective (negotiated or catalog)
  string currency_code        = 9;
  int32  tokens_per_seat      = 10;  // plan.tokens_per_period
}

message TherapistSeatUsage {
  string therapist_id = 1;
  string first_name   = 2;
  string last_name    = 3;
  string plan_tier    = 4;
  int32  tokens_used     = 5;
  int32  tokens_reserved = 6;
  int32  tokens_limit    = 7;
  bool   is_active       = 8;  // users.is_active (deactivation state)
}

message OrgSeatSummary {
  string organization_id = 1;
  repeated SeatAllocationInfo allocations = 2;
  // Per-therapist counters for the current period (docs/38 billing
  // model: enforcement per seat). Empty for orgs without allocations.
  repeated TherapistSeatUsage therapist_usage = 3;
  google.protobuf.Timestamp period_start = 4;
  google.protobuf.Timestamp period_end   = 5;
  string subscription_status = 6;
}

message AdminChangePlanRequest {
  string organization_id = 1;
  // Target plan_tier (SOLO | PRO | CLINIC | TRIAL) and cycle
  // (MONTHLY | ANNUAL). Resolves to a subscription_plans row at
  // handler time.
  string plan_tier = 2;
  string plan_cycle = 3;
  // Required, >= 10 chars.
  string reason = 4;
  string idempotency_key = 5;
}

message ListInvoicesRequest {
  string organization_id = 1;
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
}

message Invoice {
  string id = 1;
  string stripe_invoice_id = 2;
  double amount_paid = 3;
  string currency = 4;
  string invoice_pdf = 5;
  string hosted_invoice_url = 6;
  google.protobuf.Timestamp period_start = 7;
  google.protobuf.Timestamp period_end = 8;
  google.protobuf.Timestamp created_at = 9;
}


// ──────────────────────────────────────────────────────────────────
// Kody rabatowe — docs/70 §6.
// ──────────────────────────────────────────────────────────────────

message DiscountCode {
  string id            = 1;
  string code          = 2;
  string name          = 3;
  // Procent zniżki jako string dziesiętny ("33.00") — ta sama
  // konwencja co PlanInfo.price_gross, bez utraty precyzji na double.
  string percent_off   = 4;
  string duration      = 5;   // ONCE | REPEATING | FOREVER
  int32  duration_periods = 6;
  google.protobuf.Timestamp valid_from  = 7;
  google.protobuf.Timestamp valid_until = 8;
  int32  max_redemptions   = 9;
  int32  redemptions_count = 10;
  repeated string applies_to_tiers  = 11;  // puste = wszystkie plany
  repeated string applies_to_cycles = 12;
  bool   new_customers_only = 13;
  repeated string channels  = 14;          // WEB | APPLE | GOOGLE
  bool   is_active          = 15;
  string stripe_promotion_code_id = 16;
  google.protobuf.Timestamp created_at = 17;
}

message AdminCreateDiscountCodeRequest {
  string code          = 1;   // [A-Z0-9_]{3,32}, normalizowany do wielkich liter
  string name          = 2;
  string percent_off   = 3;   // (0, 100]
  string duration      = 4;   // domyślnie FOREVER
  int32  duration_periods = 5;
  google.protobuf.Timestamp valid_until = 6;   // wymagany, w przyszłości
  int32  max_redemptions = 7;                  // > 0
  repeated string applies_to_tiers  = 8;
  repeated string applies_to_cycles = 9;
  bool   new_customers_only = 10;
  repeated string channels  = 11;              // domyślnie ["WEB"]
  string reason = 15;                          // >= 10 znaków
  string idempotency_key = 16;
}

message AdminUpdateDiscountCodeRequest {
  string id   = 1;
  string name = 2;                             // puste = bez zmian
  google.protobuf.Timestamp valid_until = 3;   // brak = bez zmian
  int32  max_redemptions = 4;                  // 0 = bez zmian
  // -1 = bez zmian, 0 = dezaktywuj, 1 = aktywuj. Osobne pole zamiast
  // bool, bo proto3 nie odróżnia false od "nie ustawione".
  int32  set_active = 5;
  string reason = 15;
  string idempotency_key = 16;
}

message AdminListDiscountCodesRequest {
  bool include_inactive = 1;
}

message AdminListDiscountCodesResponse {
  repeated DiscountCode codes = 1;
}

message AdminGetDiscountCodeRequest {
  string id = 1;
}

message DiscountCodeRedemption {
  string organization_id   = 1;
  string organization_name = 2;
  string channel           = 3;
  string status            = 4;   // RESERVED | COMMITTED | RELEASED
  google.protobuf.Timestamp reserved_at  = 5;
  google.protobuf.Timestamp committed_at = 6;
}

message DiscountCodeDetails {
  DiscountCode code = 1;
  repeated DiscountCodeRedemption redemptions = 2;
}

message ValidateDiscountCodeRequest {
  string code       = 1;
  string plan_tier  = 2;   // SOLO | PRO
  string plan_cycle = 3;   // MONTHLY | ANNUAL
  // Kanał zakupu. Puste = WEB.
  string channel    = 4;
}

message DiscountCodeQuote {
  bool   valid  = 1;
  // Kod odmowy dla interfejsu: NOT_FOUND | EXPIRED | NOT_STARTED |
  // EXHAUSTED | ALREADY_USED | PLAN_NOT_ELIGIBLE | CHANNEL_NOT_ELIGIBLE |
  // NEW_CUSTOMERS_ONLY | INACTIVE.
  string reason = 2;
  string code   = 3;   // znormalizowany kod
  string name   = 4;
  string percent_off  = 5;
  // Kwoty brutto jako stringi dziesiętne w walucie planu.
  string price_before = 6;
  string price_after  = 7;
  string currency_code = 8;
  string duration = 9;
  int32  duration_periods = 10;
  // Ile użyć zostało (przybliżenie — rozstrzyga Stripe przy checkoucie).
  int32  redemptions_left = 11;
}

// ──────────────────────────────────────────────────────────────────
// Zakupy w aplikacji — docs/70 §7.2.
// ──────────────────────────────────────────────────────────────────

message StoreProduct {
  // Identyfikator produktu w sklepie, po którym aplikacja odpytuje
  // StoreKit / Play o CENĘ. Ceny nie bierzemy z backendu — musi
  // pochodzić ze sklepu, w walucie storefrontu użytkownika.
  string product_id        = 1;
  string plan_tier         = 2;
  string plan_cycle        = 3;
  int32  tokens_per_period = 4;
  // Cena referencyjna brutto (PLN) — wyłącznie do porównań i telemetrii.
  string reference_price_gross = 5;
  string currency_code         = 6;
}

message BillingSurface {
  // Kto sprzedał obecną subskrypcję: STRIPE | APPLE_IAP | GOOGLE_IAP |
  // MANUAL | P24. Puste = brak aktywnej subskrypcji.
  string active_provider = 1;
  string plan_tier       = 2;
  string status          = 3;

  // Czy paywall ma w ogóle sprzedawać na TEJ platformie.
  bool   can_purchase = 4;
  // Gdy can_purchase = false: OTHER_PROVIDER_ACTIVE | ORG_MANAGED |
  // IAP_DISABLED | PENDING_CHECKOUT | ACCOUNT_INACTIVE.
  string block_reason = 5;
  // Do kiedy blokada obowiązuje (koniec okresu u innego dostawcy).
  google.protobuf.Timestamp blocked_until = 6;

  // Produkty do pokazania na paywallu tej platformy. Puste, gdy
  // can_purchase = false.
  repeated StoreProduct products = 7;

  // NONE | TEXT | LINK — czy aplikacja może wspomnieć o zakupie na
  // superwizor.ai. NONE jest domyślne i jedyne bezpieczne bez analizy
  // warunków DMA (docs/70 R6).
  string web_link_mode = 8;

  // Czy pokazać „Przywróć zakupy" (wymóg Apple 3.1.2 na platformach
  // ze sprzedażą IAP).
  bool show_restore = 9;

  // Głęboki link do zarządzania subskrypcją: portal Stripe (web),
  // ustawienia subskrypcji w sklepie (iOS/Android). Puste dla MANUAL.
  string manage_url = 10;
}

message BeginStorePurchaseRequest {
  string platform   = 1;  // IOS | ANDROID
  string product_id = 2;
}

message BeginStorePurchaseResponse {
  bool   allowed      = 1;
  string block_reason = 2;
  google.protobuf.Timestamp blocked_until = 3;
  // UUID organizacji przekazywany do sklepu jako appAccountToken
  // (Apple) / obfuscatedExternalAccountId (Google). Jedyne wiązanie
  // transakcji z kontem.
  string app_account_token = 4;
}

message VerifyStorePurchaseRequest {
  string platform = 1;  // IOS | ANDROID
  // iOS: podpisany JWS transakcji ze StoreKit 2.
  string jws_transaction = 2;
  // Android: purchaseToken + product_id z Play Billing.
  string purchase_token = 3;
  string product_id     = 4;
}

message RestoreStorePurchasesRequest {
  string platform = 1;
  repeated string jws_transactions = 2;  // iOS
  repeated string purchase_tokens  = 3;  // Android
  string product_id = 4;                 // Android: produkt tokenów powyżej
}

message AdminListStoreTransactionsRequest {
  string organization_id = 1;
  int32  limit = 2;
}

message StoreTransactionInfo {
  string provider       = 1;
  string transaction_id = 2;
  string original_transaction_id = 3;
  string product_id     = 4;
  string environment    = 5;
  google.protobuf.Timestamp purchase_date = 6;
  google.protobuf.Timestamp expires_date  = 7;
  google.protobuf.Timestamp revocation_date = 8;
  string offer_identifier = 9;
}

message AdminListStoreTransactionsResponse {
  repeated StoreTransactionInfo transactions = 1;
}
