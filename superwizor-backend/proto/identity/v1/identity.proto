syntax = "proto3";

package identity.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/superwizor-ai/backend/gen/go/identity/v1;identityv1";

service IdentityService {
  // Validates Firebase JWT and returns user context
  rpc ValidateToken(ValidateTokenRequest) returns (UserContext);

  // Returns user profile by ID
  rpc GetUser(GetUserRequest) returns (User);

  // Returns user profile by Firebase UID (after login)
  rpc GetUserByFirebaseUID(GetUserByFirebaseUIDRequest) returns (User);

  // Creates user on first login (called from Firebase Auth trigger).
  // For role=THERAPIST, identity-svc auto-provisions a personal
  // organisation + Trial subscription (existing flow from commit 0a25ac7).
  rpc CreateUser(CreateUserRequest) returns (User);

  // Updates own profile. Web sends the full payload (every editable
  // column per docs/18 §13.4); iOS sends only the subset it knows.
  // Handler MUST do selective UPDATE — skip fields whose presence
  // wrapper is unset — so the iOS partial submit doesn't blank
  // columns it never set. See docs/18 R4/D2.
  rpc UpdateProfile(UpdateProfileRequest) returns (User);

  // Caller-scoped read of own profile. Returns the User row matching
  // the authenticated firebase_uid. Web cold-start hydration uses
  // this instead of passing user_id.
  rpc GetMyProfile(google.protobuf.Empty) returns (User);

  // RBAC: check permission on resource
  rpc CheckPermission(CheckPermissionRequest) returns (PermissionDecision);

  // ─── Web app: org self-serve + invite flow (docs/18 R4, §9) ──
  //
  // RegisterOrganization is the public self-serve endpoint. Creates
  // (in one PG tx) the organisation + headquarters Address + a
  // single User with role=ORG_ADMIN + a Trial subscription. The
  // founder is admin-only; to also record sessions they invite
  // themselves under a second email (single-role MVP).
  rpc RegisterOrganization(RegisterOrganizationRequest) returns (RegisterOrganizationResponse);

  // ORG_ADMIN scope ─ all gated on caller's role; org_id resolved
  // from the auth context, never trusted from the request.
  rpc GetMyOrganization(google.protobuf.Empty) returns (Organization);
  rpc UpdateMyOrganization(UpdateMyOrganizationRequest) returns (Organization);
  rpc InviteTherapist(InviteTherapistRequest) returns (Invitation);
  rpc ListTherapistsInMyOrg(google.protobuf.Empty) returns (ListTherapistsResponse);
  rpc RemoveTherapist(RemoveTherapistRequest) returns (google.protobuf.Empty);

  // ─── Client (patient) panel — docs/39 ──────────────────────
  //
  // InviteClient: the kartoteka's "Zaproś klienta". Same magic-link
  // machinery as manager/therapist invites (7-day token, refresh on
  // re-invite) with invited_role=PATIENT bound to the kartoteka.
  // Caller must own the kartoteka (or be a same-org ORG_ADMIN).
  rpc InviteClient(InviteClientRequest) returns (Invitation);
  // Invite/activation state for the kartoteka header (docs/39 PR6).
  rpc GetClientInviteStatus(GetClientInviteStatusRequest) returns (ClientInviteStatus);

  // Reversible activation toggle (docs/38 §4). Deactivation frees the
  // therapist's seat and blocks their sign-in (ValidateToken returns
  // PermissionDenied "ACCOUNT_DEACTIVATED"); clinical data stays
  // untouched. Reactivation re-occupies a seat in the therapist's
  // original allocation — FailedPrecondition "SEATS_EXHAUSTED" when
  // the allocation is full. Distinct from RemoveTherapist
  // (soft-delete), which remains the RODO path.
  rpc SetTherapistStatus(SetTherapistStatusRequest) returns (User);

  // Invitee scope — public endpoint, validates the magic-link token.
  // Called from the /accept-invite page after Firebase
  // createUserWithEmailAndPassword succeeds. Creates the THERAPIST
  // User row and attaches it to the inviting org.
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);

  // SUPERWIZOR_ADMIN scope ─ internal team. Every mutation writes
  // audit_events with actor_type=SUPERWIZOR_ADMIN + required reason
  // (>=10 chars enforced at handler level).
  // Admin-side org provisioning (docs/38 §4): creates the organization
  // + headquarters address + ORG_ADMIN magic-link invitations for the
  // listed manager e-mails in one PG tx. Unlike the self-serve
  // RegisterOrganization there is no founder user yet — managers join
  // via AcceptInvitation. Seat allocations + subscription start are set
  // separately via billing.AdminSetSeatAllocations.
  rpc AdminCreateOrganization(AdminCreateOrganizationRequest) returns (AdminCreateOrganizationResponse);
  // Adds an ORG_ADMIN magic-link invitation to an EXISTING organization
  // (docs/38) — the post-creation counterpart of the manager e-mails in
  // AdminCreateOrganization. Same 7-day token + org_manager_invite
  // e-mail; reason >= 10 chars → audit_events.
  rpc AdminInviteOrgManager(AdminInviteOrgManagerRequest) returns (Invitation);
  rpc AdminListOrganizations(AdminListOrganizationsRequest) returns (AdminListOrganizationsResponse);
  rpc AdminGetOrganization(AdminGetOrganizationRequest) returns (OrganizationDetails);
  rpc AdminSetOrganizationStatus(AdminSetOrganizationStatusRequest) returns (google.protobuf.Empty);
  rpc AdminUpdateOrganization(AdminUpdateOrganizationRequest) returns (Organization);
  rpc AdminListUsers(AdminListUsersRequest) returns (AdminListUsersResponse);
  rpc AdminGetUser(AdminGetUserRequest) returns (User);
  rpc AdminUpdateUser(AdminUpdateUserRequest) returns (User);
  rpc AdminDeleteUser(AdminDeleteUserRequest) returns (google.protobuf.Empty);
  // Global cross-org audit history (docs/18 §8.2). Cursor-paginated;
  // optional filters AND together. Used by the /admin/audit page.
  rpc AdminListAuditEvents(AdminListAuditEventsRequest) returns (AdminListAuditEventsResponse);

  // ─── Report customization (docs/10_REPORT_CUSTOMIZATION.md) ───
  // Returns the therapist's report style preferences. The active
  // suggestion banner (if any) is fetched separately from
  // clinical-svc.GetActiveSuggestion — identity-svc has no
  // dependency on clinical data tables (it's the bottom of the
  // service dep tree).
  rpc GetReportPreferences(GetReportPreferencesRequest) returns (ReportPreferences);

  // Updates the therapist's preferences. Idempotent: re-sending the
  // same payload is a no-op past the first write.
  rpc UpdateReportPreferences(UpdateReportPreferencesRequest) returns (ReportPreferences);

  // ─── Cross-origin SSO (marketing-site → Flutter app) ────────
  //
  // Mints a short-lived Firebase custom token for the authenticated
  // caller, scoped to the caller's own Firebase UID. The marketing
  // site uses this to hand off an active session to the Flutter web
  // app (different origin → separate Firebase Auth IndexedDB), so
  // the user doesn't have to log in twice.
  //
  // Tokens expire 1h after issuance per Firebase Admin SDK defaults
  // and are single-use in practice (the receiving origin redeems
  // them via signInWithCustomToken, after which they're spent).
  // The handler does not accept a uid in the request — it always
  // mints for the caller. No org/role escalation surface.
  rpc MintAppLoginToken(google.protobuf.Empty) returns (AppLoginToken);

  // Health check
  rpc HealthCheck(google.protobuf.Empty) returns (HealthCheckResponse);

  // ─── RODO/GDPR Consent Logging ───
  // Records a user consent choice (TOS, MARKETING, RECORDING, etc.)
  // for auditing compliance.
  rpc RecordConsent(RecordConsentRequest) returns (RecordConsentResponse);

  // Checks if an email address is already registered in our system
  rpc CheckEmailExists(CheckEmailExistsRequest) returns (CheckEmailExistsResponse);
}

message AppLoginToken {
  // Firebase custom token (JWT). Pass to firebase_auth's
  // signInWithCustomToken() on the receiving origin.
  string token = 1;
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_THERAPIST = 1;
  USER_ROLE_PATIENT = 2;
  // Web app additions per docs/18 R4. Single-role MVP — a user holds
  // exactly one role. Org founders are ORG_ADMIN only (cannot record
  // sessions); to also practise they invite themselves as THERAPIST.
  USER_ROLE_ORG_ADMIN = 3;
  USER_ROLE_SUPERWIZOR_ADMIN = 4;
}

enum OrganizationType {
  ORGANIZATION_TYPE_UNSPECIFIED = 0;
  ORGANIZATION_TYPE_SOLO = 1;
  ORGANIZATION_TYPE_CLINIC = 2;
  ORGANIZATION_TYPE_ENTERPRISE = 3;
}

message User {
  string id = 1;
  UserRole role = 2;
  string organization_id = 3;
  string firebase_uid = 4;
  string email = 5;
  string phone_number = 6;
  bool is_email_verified = 7;
  string first_name = 8;
  string last_name = 9;
  string professional_title = 10;
  string credentials_number = 11;
  string ui_language = 12;
  string timezone = 13;
  bool has_accepted_tos = 14;
  google.protobuf.Timestamp created_at = 15;
  string biography = 16;
  string avatar_url = 17;
  string default_modality_id = 18;
  string billing_address_id = 19;
  bool has_marketing_consent = 20;
  // FALSE = reversibly deactivated by ORG_ADMIN (SetTherapistStatus).
  // Sign-in blocked; data untouched. Independent of soft-delete.
  bool is_active = 21;
  // Type of the user's organization (docs/38): CLINIC/ENTERPRISE means
  // a managed B2B org — clients hide self-serve billing surfaces.
  // Populated by GetMyProfile (needs an org lookup); other RPCs may
  // leave it UNSPECIFIED.
  OrganizationType organization_type = 22;
}

message UserContext {
  string user_id = 1;
  string firebase_uid = 2;
  UserRole role = 3;
  string organization_id = 4;
  string email = 5;
}

message ValidateTokenRequest {
  string firebase_id_token = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserByFirebaseUIDRequest {
  string firebase_uid = 1;
}

message CreateUserRequest {
  string firebase_uid = 1;
  string email = 2;
  UserRole role = 3;
  string first_name = 4;
  string last_name = 5;
  string ui_language = 6;
  string timezone = 7;
  bool has_accepted_tos = 8;
  // Optional: plan tier to provision on signup. Valid values:
  //   - "" or "TRIAL" → default trial (5 tokens)
  //   - "BETA"        → beta program (120 tokens × 2 months)
  // Paid tiers (SOLO/PRO) are provisioned via Stripe Checkout,
  // not through this field.
  string initial_plan_tier = 9;
}

// UpdateProfileRequest is the iOS-compatible profile mutation. Per
// docs/18 D2: iOS sends a subset (fields 2-7), web sends the full
// payload. The handler does a selective UPDATE — fields whose
// `optional` wrapper is unset are skipped; empty strings on
// fields 2-7 (iOS contract) are also skipped to preserve the
// "missing field means no change" semantics existing clients rely
// on. New fields 8-13 use `optional` so the wire distinguishes
// "blank the column" from "don't touch it" cleanly.
message UpdateProfileRequest {
  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string professional_title = 4;
  string credentials_number = 5;
  string biography = 6;
  string phone_number = 7;
  // Web additions (docs/18 §13.4) — full editable surface.
  optional string avatar_url = 8;
  optional string default_modality_id = 9;
  optional string ui_language = 10;
  optional string timezone = 11;
  optional Address billing_address = 12;
  optional bool has_marketing_consent = 13;
}

message CheckPermissionRequest {
  string user_id = 1;
  string resource_type = 2; // "patient_file", "session", etc.
  string resource_id = 3;
  string action = 4; // "read", "write", "delete"
}

message PermissionDecision {
  bool allowed = 1;
  string reason = 2; // human-readable reason if denied
}

message HealthCheckResponse {
  string status = 1;
  string version = 2;
}

// ─── Report customization messages ───
// Each enum-valued field stores the string ID of the choice (e.g.
// "brief", "clinical_formal") — UI translates to localized labels.
// Empty strings mean "use default" for that dimension; the renderer
// in ai-pipeline-svc treats them as no-op.
message ReportPreferences {
  // Schema version. Bump when we add a new dimension without a
  // proto-message change so renderers can branch on it.
  int32 version = 1;

  // Length: "brief" | "standard" | "detailed"
  string length = 2;
  // Tone: "clinical_formal" | "empathic_warm" | "pragmatic_direct"
  // | "academic_rigorous"
  string tone = 3;
  // Quote density: "few" | "selective" | "many"
  string quote_density = 4;
  // Diagnostic language: "descriptive" | "clinical_labels" | "dsm_icd"
  string diagnostic_language = 5;
  // Hypothesis hedging: "tentative" | "balanced" | "assertive"
  string hypothesis_hedging = 6;
  // Multi-select section IDs to expand:
  // "clinical_picture", "interventions", "case_formulation",
  // "supervisory_recommendations", "homework_between_sessions",
  // "cultural_context", "safety_and_risk".
  repeated string section_emphasis = 7;
  // Strengths framing: "problem_focused" | "balanced" | "strengths_first"
  string strengths_framing = 8;
  // Free-text additional guidance, ≤500 chars, server-sanitized.
  string free_text = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message GetReportPreferencesRequest {
  string therapist_id = 1;
}

message UpdateReportPreferencesRequest {
  string therapist_id = 1;
  ReportPreferences preferences = 2;
  // Required: must be a stable client-generated UUID. Same key with
  // same payload → no-op past the first write. Same key with
  // different payload → AlreadyExists (idempotency violation).
  string idempotency_key = 3;
}

// ──────────────────────────────────────────────────────────────────
// Web app messages — docs/18 §13 (Forms catalogue), §6.1 (RPCs).
// ──────────────────────────────────────────────────────────────────

// Address is the shared shape used by Organization headquarters and
// User billing addresses. Backed by the `addresses` PG table; the
// handler creates one row per parent (org / user) and updates it
// in place on subsequent edits.
message Address {
  string id = 1;                  // server-set; ignored on create
  string country_code = 2;        // ISO 3166-1 alpha-2 (e.g. "PL")
  string region = 3;              // voivodeship / state — optional
  string city = 4;
  string postal_code = 5;
  string street_line = 6;
  string building_number = 7;
  string unit_number = 8;         // optional
  string directions = 9;          // optional free text
}

message Organization {
  string id = 1;
  string legal_name = 2;
  string tax_id = 3;              // NIP for PL
  string vat_id_eu = 4;           // EU VAT ID for VIES
  OrganizationType type = 5;      // SOLO | CLINIC | ENTERPRISE
  Address headquarters_address = 6;
  string primary_admin_user_id = 7;
  google.protobuf.Timestamp created_at = 8;
  bool is_blocked = 9;            // derived from subscriptions.status
}

// RegisterOrganization payload — clinic founder self-serve.
//
// The founder becomes role=ORG_ADMIN with no THERAPIST powers
// (single-role MVP per docs/18 R4). To also record sessions they
// invite themselves under a different email via the standard
// invitation flow (§9).
message RegisterOrganizationRequest {
  // Founder user fields
  string firebase_uid = 1;        // from Firebase Auth on the client
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string phone_number = 5;        // required for billing contact
  string ui_language = 6;         // 'pl' default
  string timezone = 7;            // 'Europe/Warsaw' default
  bool has_accepted_tos = 8;
  bool has_marketing_consent = 9;

  // Organization fields
  string legal_name = 10;
  OrganizationType type = 11;     // CLINIC default for clinic reg
  string tax_id = 12;             // NIP for PL — required for PL
  string vat_id_eu = 13;          // optional unless cross-border
  Address headquarters_address = 14;

  // Idempotency: same key with same payload → returns existing org.
  string idempotency_key = 15;
}

message RegisterOrganizationResponse {
  User user = 1;                  // the new ORG_ADMIN
  Organization organization = 2;
}

message UpdateMyOrganizationRequest {
  // org_id resolved from caller's auth context — not in the wire
  // payload (org-admin can only edit their own org).
  optional string legal_name = 1;
  optional OrganizationType type = 2;
  optional string tax_id = 3;
  optional string vat_id_eu = 4;
  optional Address headquarters_address = 5;
  optional string primary_admin_user_id = 6;  // for ownership transfer
}

// ──────────────────────────────────────────────────────────────────
// Invitations (magic-link flow — docs/18 §9)
// ──────────────────────────────────────────────────────────────────

message Invitation {
  string id = 1;
  string organization_id = 2;
  string invited_by_user = 3;
  string email = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp accepted_at = 6;  // empty if pending
  google.protobuf.Timestamp created_at = 7;
  // Role the acceptor will be created with (docs/38): THERAPIST for
  // team invites, ORG_ADMIN for manager invites minted by
  // AdminCreateOrganization. Never SUPERWIZOR_ADMIN.
  UserRole invited_role = 8;
  // Seat allocation the invite is pinned to (THERAPIST only). A
  // pending invitation reserves one seat until accepted or expired.
  string allocation_id = 9;
  // Name the inviter typed — shown in the pending-invitations list
  // and prefilled on the accept page (acceptor's input wins).
  string first_name = 10;
  string last_name = 11;
}

message InviteTherapistRequest {
  string email = 1;
  // Suggested fields pre-populate the accept-invite page; invitee
  // can edit any of them. Optional.
  string first_name = 2;
  string last_name = 3;
  string default_modality_id = 4;
  string idempotency_key = 5;
  // Seat allocation (org × plan) this therapist occupies (docs/38).
  // Optional for orgs without allocations (legacy/self-serve). When
  // set, free-seat validation applies: FAILED_PRECONDITION
  // "SEATS_EXHAUSTED" when active seats + pending invites >= seats.
  string allocation_id = 6;
}

message InviteClientRequest {
  string patient_file_id = 1;
  // Optional override; when empty the kartoteka's patient_email is
  // used (FailedPrecondition if neither exists). A provided value is
  // persisted back onto patient_files.patient_email.
  string email = 2;
}

message GetClientInviteStatusRequest {
  string patient_file_id = 1;
}

message ClientInviteStatus {
  // NONE — never invited; PENDING — invitation outstanding;
  // ACTIVE — client activated (firebase_uid attached, is_active);
  // INACTIVE — activated but deactivated (users.is_active=false).
  string status = 1;
  string email = 2;                          // masked not needed — therapist already knows it
  google.protobuf.Timestamp expires_at = 3;  // PENDING only
}

message SetTherapistStatusRequest {
  string user_id = 1;    // must be a THERAPIST in the caller's org
  bool is_active = 2;
  string reason = 3;     // optional; audit only
}

message AcceptInvitationRequest {
  // The url-safe-base64 token from the email link (NOT hashed —
  // the handler SHA-256s the incoming value before looking up in
  // invitations.token_hash).
  string token = 1;
  // Firebase UID of the just-created Firebase Auth account. The
  // client calls createUserWithEmailAndPassword first, then sends
  // this RPC to attach the new account to the inviting org.
  string firebase_uid = 2;
  string first_name = 3;
  string last_name = 4;
  string default_modality_id = 5;  // optional override
  string ui_language = 6;
  string timezone = 7;
  bool has_accepted_tos = 8;
  bool has_marketing_consent = 9;
}

message AcceptInvitationResponse {
  User user = 1;                  // the new THERAPIST
  Organization organization = 2;  // the joined org (for the welcome page)
}

message TherapistEntry {
  // For an active (accepted) therapist, populated user is set and
  // pending_invitation is empty. For a pending invitation, the
  // reverse — `user` is empty.
  User user = 1;
  Invitation pending_invitation = 2;
}

message ListTherapistsResponse {
  repeated TherapistEntry therapists = 1;
}

message RemoveTherapistRequest {
  string user_id = 1;             // must be in the caller's org
  string reason = 2;              // optional; audit only
}

// ──────────────────────────────────────────────────────────────────
// SUPERWIZOR_ADMIN messages
// ──────────────────────────────────────────────────────────────────

message AdminCreateOrganizationRequest {
  string legal_name = 1;
  string tax_id = 2;                    // optional
  string vat_id_eu = 3;                 // optional
  Address headquarters = 4;
  OrganizationType type = 5;            // CLINIC | ENTERPRISE
  // Org manager e-mails — each gets an ORG_ADMIN magic-link
  // invitation (7-day expiry). At least one required.
  repeated string manager_emails = 6;
  string reason = 15;                   // required, >=10 chars; audit
  string idempotency_key = 16;
}

message AdminInviteOrgManagerRequest {
  string organization_id = 1;
  string email = 2;
  string reason = 15;             // required, >= 10 chars
}

message AdminCreateOrganizationResponse {
  Organization organization = 1;
  // The ORG_ADMIN invitations created (one per manager e-mail),
  // so the admin UI can show pending state immediately.
  repeated Invitation manager_invitations = 2;
}

message AdminListOrganizationsRequest {
  // Pagination — for now we just slice on (created_at, id) ordering.
  int32 page_size = 1;            // default 50, cap 200
  string page_token = 2;          // opaque
  string search = 3;              // matches legal_name (ILIKE) — optional
  // Optional type filter (UNSPECIFIED = all). The /admin/orgs table
  // defaults to CLINIC — B2B clinics are the admin's day-to-day; solo
  // bootstrap orgs are noise there.
  OrganizationType type = 4;
}

message OrganizationSummary {
  Organization organization = 1;
  int32 therapists_count = 2;
  google.protobuf.Timestamp last_session_at = 3;
}

message AdminListOrganizationsResponse {
  repeated OrganizationSummary organizations = 1;
  string next_page_token = 2;
}

message AdminGetOrganizationRequest {
  string organization_id = 1;
}

// Richer view than Organization — includes admin-relevant adjuncts.
message OrganizationDetails {
  Organization organization = 1;
  repeated User therapists = 2;
  // Recent audit history scoped to this org (last 20 entries).
  repeated AuditEntry recent_audit = 3;
  // Org managers (role=ORG_ADMIN) — the candidate pool for the
  // primary-admin transfer select on /admin/orgs/[id] (docs/38).
  repeated User managers = 4;
}

message AuditEntry {
  string id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string actor_email = 3;         // resolved from actor_user_id
  string action = 4;
  string reason = 5;
  string resource_type = 6;
  string resource_id = 7;
}

message AdminSetOrganizationStatusRequest {
  string organization_id = 1;
  // Currently supports: "active" | "blocked". Maps to
  // subscriptions.status (ACTIVE / PAST_DUE).
  string desired_status = 2;
  string reason = 3;              // required, >=10 chars
}

message AdminUpdateOrganizationRequest {
  string organization_id = 1;
  optional string legal_name = 2;
  optional OrganizationType type = 3;
  optional string tax_id = 4;
  optional string vat_id_eu = 5;
  optional Address headquarters_address = 6;
  optional string primary_admin_user_id = 7;
  string reason = 8;              // required, >=10 chars
}

message AdminListUsersRequest {
  int32 page_size = 1;
  string page_token = 2;
  // Optional filters — all AND-ed when set.
  string organization_id = 3;
  UserRole role = 4;
  string search = 5;              // email or name ILIKE
}

message AdminListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}

message AdminGetUserRequest {
  string user_id = 1;
}

message AdminUpdateUserRequest {
  string user_id = 1;
  optional string email = 2;
  optional string first_name = 3;
  optional string last_name = 4;
  optional string phone_number = 5;
  optional UserRole role = 6;
  optional string organization_id = 7;
  optional string default_modality_id = 8;
  optional string ui_language = 9;
  optional string timezone = 10;
  optional string professional_title = 11;
  optional string credentials_number = 12;
  optional string biography = 13;
  optional string avatar_url = 14;
  optional Address billing_address = 15;
  optional bool is_email_verified = 16;
  string reason = 17;             // required, >=10 chars
}

message AdminDeleteUserRequest {
  string user_id = 1;
  string reason = 2;              // required, >=10 chars
}

// Global cross-org audit list, used by the /admin/audit viewer.
// All filters are optional and AND together when set; empty actor_email
// / action / since / until means "any". Pagination uses the same
// (occurred_at, id) cursor format as the other admin lists.
message AdminListAuditEventsRequest {
  int32 page_size = 1;            // default 50, cap 200
  string page_token = 2;          // opaque
  string actor_email = 3;         // ILIKE — matches users.email
  string action = 4;              // exact match (e.g. "organization.update")
  google.protobuf.Timestamp since = 5;
  google.protobuf.Timestamp until = 6;
}

message AdminListAuditEventsResponse {
  repeated AuditEntry events = 1;
  string next_page_token = 2;
}

// ─── RODO/GDPR Consent messages ───

message RecordConsentRequest {
  string user_id = 1;
  string consent_type = 2; // e.g., 'TOS', 'MARKETING', 'RECORDING'
  bool granted = 3;
  string consent_version = 4; // e.g. 'v1.0.2', '2026-06-01'
  string ip_address = 5;
  string user_agent = 6;
}

message RecordConsentResponse {
  string consent_record_id = 1;
  google.protobuf.Timestamp recorded_at = 2;
}

message CheckEmailExistsRequest {
  string email = 1;
}

message CheckEmailExistsResponse {
  bool exists = 2;
  bool is_pending_deletion = 3;
}

