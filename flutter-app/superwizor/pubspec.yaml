name: superwizor
description: "Superwizor AI — clinical session co-pilot for psychotherapists."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  firebase_messaging: ^16.0.4
  cloud_firestore: ^6.0.4

  # gRPC
  grpc: ^5.1.0
  protobuf: ^6.0.0

  # State + nav
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.2

  # UI
  google_fonts: ^8.1.0
  shimmer: ^3.0.0
  lottie: ^3.3.2

  # Audio
  record: ^6.2.0
  audioplayers: ^6.1.2
  wakelock_plus: ^1.5.2

  # Storage / persistence
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Crypto
  crypto: ^3.0.7
  encrypt: ^5.0.3
  uuid: ^4.5.3

  # PDF (transcript export + legal viewer)
  pdf: ^3.11.1
  printing: ^5.13.4
  pdfx: ^2.9.2

  # Background work
  workmanager: ^0.5.2

  # Networking
  http: ^1.6.0
  share_plus: ^11.1.0
  url_launcher: ^6.3.2

  # Permissions
  permission_handler: ^12.0.1

  # Utilities
  fixnum: ^1.1.1
  intl: ^0.20.2
  device_info_plus: ^11.4.0
  package_info_plus: ^9.0.1
  collection: ^1.19.0

  # i18n (D7) — generated AppLocalizations
  firebase_core_platform_interface: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.6
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
  generate: true   # generuje AppLocalizations z lib/l10n/app_pl.arb (D7)

  assets:
    - assets/legal/
    - assets/sounds/
    - assets/animations/
