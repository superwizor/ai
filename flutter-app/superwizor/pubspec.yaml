name: superwizor
description: "Superwizor AI — clinical session co-pilot for psychotherapists."
publish_to: 'none'

version: 1.0.8+50

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  firebase_messaging: ^16.0.4
  cloud_firestore: ^6.0.4
  # firebase_ai removed 2026-08-20. The chat called Vertex AI directly
  # from the device through it; that path is gone — the guardrail runs
  # server-side (ADR docs/kronikarz/62 section 6), so the app has no
  # model client at all any more. Keeping the dependency would leave a
  # loaded gun in the pubspec: the next feature that wants "just one
  # quick model call" would find it already available.

  # gRPC
  grpc: ^5.1.0
  protobuf: ^6.0.0

  # State + nav
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.2

  # UI
  shimmer: ^3.0.0
  lottie: ^3.3.2

  # Audio
  record: ^6.2.0
  wakelock_plus: ^1.5.2

  # Storage / persistence
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Crypto
  crypto: ^3.0.7
  encrypt: ^5.0.3
  uuid: ^4.5.3

  # PDF (transcript export + legal viewer)
  pdf: ^3.11.1
  printing: ^5.13.4

  # Networking
  http: ^1.6.0
  share_plus: ^11.1.0
  url_launcher: ^6.3.2
  # connectivity_plus: emits Connectivity events for the upload queue
  # runner so a queued upload retries as soon as Wi-Fi / cellular
  # comes back, instead of waiting for the next periodic tick.
  connectivity_plus: ^6.1.5

  # Permissions
  permission_handler: ^12.0.1

  # Utilities
  fixnum: ^1.1.1
  intl: ^0.20.2
  device_info_plus: ^11.4.0
  package_info_plus: ^9.0.1
  collection: ^1.19.0

  # i18n (D7) — generated AppLocalizations
  firebase_core_platform_interface: ^8.0.0
  flutter_markdown: ^0.7.7+1
  file_picker: ^11.0.2
  image_picker: ^1.2.2
  shared_preferences: ^2.5.5
  firebase_storage: ^13.3.0
  flutter_svg: ^2.3.0
  google_sign_in: ^7.2.0
  local_auth: ^3.0.1
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  audioplayers: ^6.7.1
  firebase_crashlytics: ^5.2.0
  firebase_performance: ^0.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.6
  build_runner: ^2.5.4
  flutter_launcher_icons: ^0.14.4
  custom_lint: ^0.8.1
  hardcoded_strings_lint: ^1.0.4
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/Ico/Logo_Superwizor_MVP.png"
    background_color: "#004D54"
    theme_color: "#004D54"
  macos:
    generate: true
    image_path: "assets/Ico/Logo_Superwizor_MVP.png"
  adaptive_icon_background: "#B1C9CB"
  adaptive_icon_foreground: "assets/Ico/Logo_Superwizor_MVP.png"
  remove_alpha_ios: true
  image_path: "assets/Ico/Logo_Superwizor_MVP.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  generate: true   # generuje AppLocalizations z lib/l10n/app_pl.arb (D7)

  assets:
    - assets/legal/
    - assets/sounds/
    - assets/Ico/
    - assets/images/svg/
    - assets/images/PNG/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat/Montserrat-Bold.ttf
          weight: 700
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather/Merriweather-Italic.ttf
          style: italic
        - asset: assets/fonts/Merriweather/Merriweather-Bold.ttf
          weight: 700
        - asset: assets/fonts/Merriweather/Merriweather-BoldItalic.ttf
          weight: 700
          style: italic
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono/RobotoMono-Medium.ttf
          weight: 500
